<tspan x="1221" dy="0">rbAmp</tspan></text></g><g><path d="M1221 420 L1221 460" class="ln-data"></path></g><circle cx="1221" cy="420" r="5" class="pin"></circle><g><path d="M1221 420 L1221 372" class="ln-ghost"></path></g><g><rect x="1211" y="328" width="20" height="44" rx="3" class="box-ghost"></rect><g><path d="M1210 339 L1232 361 M1232 339 L1210 361" class="cross"></path></g></g><text x="1221" y="528.48" class="t-small t-bad t-bold" text-anchor="middle"><tspan x="1221" dy="0">cut</tspan></text><g class="rb-box"><rect x="1266" y="460" width="74" height="44" rx="10" class="box"></rect><text x="1303" y="483.58000000000004" class="t-small" text-anchor="middle" transform="translate(0 4.8)"><tspan x="1303" dy="0">rbAmp</tspan></text></g><g><path d="M1303 420 L1303 460" class="ln-data"></path></g><circle cx="1303" cy="420" r="5" class="pin"></circle><g><path d="M1303 420 L1303 372" class="ln-ghost"></path></g><g><rect x="1293" y="328" width="20" height="44" rx="3" class="box-ghost"></rect><g><path d="M1292 339 L1314 361 M1314 339 L1292 361" class="cross"></path></g></g><text x="1303" y="528.48" class="t-small t-bad t-bold" text-anchor="middle"><tspan x="1303" dy="0">cut</tspan></text><text x="1340" y="312.48" class="t-small t-navy t-bold" text-anchor="end"><tspan x="1340" dy="0">built-in 4.7 kΩ</tspan></text><text x="960" y="209.12" class="t-body t-body t-bold"><tspan x="960" dy="0">cut on ALL modules; one</tspan><tspan x="960" dy="32">external 2.7–3.3 kΩ pair near</tspan><tspan x="960" dy="32">the master</tspan></text><g class="rb-box"><rect x="40" y="590" width="1320" height="176" rx="10" class="box-white"></rect><text x="56" y="624.72" class="t-body t-bold"><tspan x="56" dy="0">On the module: solder jumpers “I2C pull-up”</tspan></text></g><circle cx="66" cy="653.02" r="3.5" class="dot "></circle><text x="80" y="658.48" class="t-small t-ink"><tspan x="80" dy="0">two jumpers, one per line (SDA, SCL), silkscreen I2C pull-up</tspan></text><circle cx="66" cy="681.17" r="3.5" class="dot "></circle><text x="80" y="686.63" class="t-small t-ink"><tspan x="80" dy="0">from the factory the pads are joined by a thin trace = pull-up ON</tspan></text><circle cx="66" cy="709.3199999999999" r="3.5" class="dot "></circle><text x="80" y="714.78" class="t-small t-ink"><tspan x="80" dy="0">to disable: cut the trace between the pads with a knife</tspan></text><circle cx="66" cy="737.4699999999999" r="3.5" class="dot "></circle><text x="80" y="742.93" class="t-small t-ink"><tspan x="80" dy="0">to restore: bridge the pads with a blob of solder</tspan></text><rect x="900" y="606" width="190" height="112" rx="8" fill="#2f7d4f" stroke="#1f5a37" stroke-width="2"></rect><text x="995" y="632.48" class="t-small t-white t-bold t-mono" text-anchor="middle"><tspan x="995" dy="0">I2C pull-up</tspan></text><g><rect x="950" y="649" width="26" height="22" rx="3" fill="var(--jumper-pad, #d9a21b)" stroke="var(--navy)" stroke-width="1.5"></rect><rect x="1014" y="649" width="26" height="22" rx="3" fill="var(--jumper-pad, #d9a21b)" stroke="var(--navy)" stroke-width="1.5"></rect><line x1="976" y1="660" x2="1014" y2="660" stroke="var(--jumper-pad, #d9a21b)" stroke-width="6"></line></g><g><rect x="950" y="681" width="26" height="22" rx="3" fill="var(--jumper-pad, #d9a21b)" stroke="var(--navy)" stroke-width="1.5"></rect><rect x="1014" y="681" width="26" height="22" rx="3" fill="var(--jumper-pad, #d9a21b)" stroke="var(--navy)" stroke-width="1.5"></rect><line x1="976" y1="692" x2="1014" y2="692" stroke="var(--jumper-pad, #d9a21b)" stroke-width="6"></line></g><text x="995" y="742.48" class="t-small t-ok t-bold" text-anchor="middle"><tspan x="995" dy="0">factory: pull-ups ON</tspan></text><rect x="1150" y="606" width="190" height="112" rx="8" fill="#2f7d4f" stroke="#1f5a37" stroke-width="2"></rect><text x="1245" y="632.48" class="t-small t-white t-bold t-mono" text-anchor="middle"><tspan x="1245" dy="0">I2C pull-up</tspan></text><g><rect x="1200" y="649" width="26" height="22" 