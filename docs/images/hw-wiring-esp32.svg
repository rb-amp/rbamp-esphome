680.6800000000001" class="t-small t-ink"><tspan x="1051" dy="0">DRDY optional: open-drain,</tspan><tspan x="1051" dy="28">10 kΩ pull-up to 3V3, LOW</tspan><tspan x="1051" dy="28">pulse every ~100 ms</tspan></text></g><g><rect x="40" y="777.75" width="1320" height="56" rx="10" class="box-warn"></rect><text x="106" y="812.87" class="t-body t-warn t-bold"><tspan x="106" dy="0">Mains voltage can kill — de-energise first</tspan></text><g><path d="M74 787.05 L93.72 821.05 L54.28 821.05 Z" class="tri"></path><rect x="71.96" y="798.95" width="4.08" height="12.24" rx="2" class="tri-mark"></rect><circle cx="74" cy="815.95" r="2.3800000000000003" class="tri-mark"></circle></g></g></svg>