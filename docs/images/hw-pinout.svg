<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 641" width="1400" height="641" class="rb" role="img"><style>svg.rb {  --navy: #00203F;  --mint: #ADEFD1;  --body: #1a2030;  --muted: #8a9ab0;  --box: #f8f9fa;  --border: #dee2e6;  --code: #1e1e1e;  --code-fg:#e8e8e8; --white: #ffffff;  --mains: #c2410c;  --mains-bg: #fff1e8; --neutral: #1d4ed8;  --lv: #00203F;  --data: #0f766e;  --data-bg: #e6f6f2; --warn: #b45309;  --warn-bg: #fff4d6; --ok: #15803d; --ok-bg: #e3f5e8; --bad: #b91c1c; --bad-bg: #fde8e8; --ghost: #c6ccd4;   --font-sans: Inter, "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif; --font-mono: "JetBrains Mono", "SF Mono", Consolas, Menlo, "DejaVu Sans Mono", monospace; --fs-title: 34px; --fs-sub: 22px; --fs-h: 26px;  --fs-body: 24px;  --fs-small: 21px;  --fs-mono: 22px;  --stroke: 2px;  --wire: 4px;  --wire-thin:2.5px; --radius: 10px; --radius-sm:6px; } svg.rb { font-family: var(--font-sans); font-size: var(--fs-body); fill: var(--body); } svg.rb text { fill: var(--body); font-size: var(--fs-body); white-space: pre; } svg.rb .t-title { font-size: var(--fs-title); font-weight: 600; fill: var(--navy); } svg.rb .t-sub { font-size: var(--fs-sub); fill: var(--muted); } svg.rb .t-h { font-size: var(--fs-h); font-weight: 600; fill: var(--navy); } svg.rb .t-body { font-size: var(--fs-body); fill: var(--body); } svg.rb .t-small { font-size: var(--fs-small); fill: var(--muted); } svg.rb .t-muted { fill: var(--muted); } svg.rb .t-navy { fill: var(--navy); } svg.rb .t-white { fill: var(--white); } svg.rb .t-bold { font-weight: 600; } svg.rb .t-mono { font-family: var(--font-mono); font-size: var(--fs-mono); } svg.rb .t-code { font-family: var(--font-mono); font-size: var(--fs-mono); fill: var(--code-fg); } svg.rb .t-mains { fill: var(--mains); } svg.rb .t-neutral { fill: var(--neutral); } svg.rb .t-data { fill: var(--data); } svg.rb .t-warn { fill: var(--warn); } svg.rb .t-ok { fill: var(--ok); } svg.rb .t-bad { fill: var(--bad); } svg.rb .t-center { text-anchor: middle; } svg.rb .t-right { text-anchor: end; } svg.rb .t-ink { fill: var(--body); }   svg.rb .box { fill: var(--box); stroke: var(--border); stroke-width: var(--stroke); } svg.rb .box-white { fill: var(--white); stroke: var(--border); stroke-width: var(--stroke); } svg.rb .box-navy { fill: var(--navy); stroke: var(--navy); stroke-width: var(--stroke); } svg.rb .box-code { fill: var(--code); stroke: var(--code); stroke-width: var(--stroke); } svg.rb .box-warn { fill: var(--warn-bg); stroke: var(--warn); stroke-width: var(--stroke); } svg.rb .box-ok { fill: var(--ok-bg); stroke: var(--ok); stroke-width: var(--stroke); } svg.rb .box-bad { fill: var(--bad-bg); stroke: var(--bad); stroke-width: var(--stroke); } svg.rb .box-data { fill: var(--data-bg); stroke: var(--data); stroke-width: var(--stroke); } svg.rb .box-mains { fill: var(--mains-bg); stroke: var(--mains); stroke-width: var(--stroke); } svg.rb .box-mint { fill: var(--mint); stroke: var(--mint); stroke-width: var(--stroke); } svg.rb .box-ghost { fill: none; stroke: var(--ghost); stroke-width: var(--stroke); stroke-dasharray: 8 6; } svg.rb .box-dashed { fill: none; stroke: var(--muted); stroke-width: var(--stroke); stroke-dasharray: 10 7; } svg.rb .box-outline{ fill: none; stroke: var(--navy); stroke-width: var(--stroke); }  svg.rb .ln { fill: none; stroke: var(--navy); stroke-width: var(--wire); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-thin { fill: none; stroke: var(--navy); stroke-width: var(--wire-thin); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-muted { fill: none; stroke: var(--muted); stroke-width: var(--wire-thin); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-mains { fill: none; stroke: var(--mains); stroke-width: var(--wire); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-neutral{ fill: none; stroke: var(--neutral); stroke-width: var(--wire); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-data { fill: none; stroke: var(--data); stroke-width: var(--wire-thin); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-ok { fill: none; stroke: var(--ok); stroke-width: var(--wire); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-bad { fill: none; stroke: var(--bad); stroke-width: var(--wire); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-warn { fill: none; stroke: var(--warn); stroke-width: var(--wire); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-ghost { fill: none; stroke: var(--ghost); stroke-width: var(--wire-thin); stroke-linecap: round; stroke-dasharray: 8 6; } svg.rb .dash { stroke-dasharray: 10 7; } svg.rb .dash-sm { stroke-dasharray: 4 5; }  svg.rb .ah { fill: var(--mint); stroke: var(--navy); stroke-width: 1.5px; stroke-linejoin: round; } svg.rb .ah-navy { fill: var(--navy); stroke: var(--navy); stroke-width: 1.5px; } svg.rb .ah-muted { fill: var(--muted); stroke: var(--muted); } svg.rb .ah-mains { fill: var(--mains); stroke: var(--mains); } svg.rb .ah-neutral{ fill: var(--neutral); stroke: var(--neutral); } svg.rb .ah-data { fill: var(--data); stroke: var(--data); } svg.rb .ah-ok { fill: var(--ok); stroke: var(--ok); } svg.rb .ah-bad { fill: var(--bad); stroke: var(--bad); } svg.rb .ah-warn { fill: var(--warn); stroke: var(--warn); } svg.rb .ah-ghost { fill: var(--ghost); stroke: var(--ghost); }  svg.rb .clamp { fill: var(--white); stroke: var(--navy); stroke-width: var(--wire); } svg.rb .clamp-gap { stroke: var(--white); stroke-width: 6px; } svg.rb .terminal { fill: var(--white); stroke: var(--navy); stroke-width: var(--stroke); } svg.rb .pin { fill: var(--navy); } svg.rb .pin-ghost { fill: var(--ghost); } svg.rb .dot { fill: var(--navy); } svg.rb .dot-mains { fill: var(--mains); } svg.rb .dot-neutral { fill: var(--neutral); } svg.rb .dot-white { fill: var(--white); } svg.rb .dot-mint { fill: var(--mint); } svg.rb .tri { fill: var(--warn-bg); stroke: var(--warn); stroke-width: 3px; stroke-linejoin: round; } svg.rb .tri-mark { fill: var(--warn); } svg.rb .cross { stroke: var(--bad); stroke-width: 5px; stroke-linecap: round; } svg.rb .tick { fill: none; stroke: var(--ok); stroke-width: 5px; stroke-linecap: round; stroke-linejoin: round; } svg.rb .hatch { stroke: var(--ghost); stroke-width: 2px; }</style><title>Low-voltage header: pins and what they need</title><text x="40" y="69.92" class="t-title"><tspan x="40" dy="0">Low-voltage header: pins and what they need</tspan></text><g class="rb-box"><rect x="40" y="130" width="400" height="440" rx="10" class="box"></rect><text x="56" y="166.48" class="t-h"><tspan x="56" dy="0">rbAmp module</tspan></text></g><text x="60" y="198.48" class="t-small"><tspan x="60" dy="0">low-voltage side</tspan></text><text x="60" y="288.48" class="t-small t-mains"><tspan x="60" dy="0">mains side: CT jack I0,</tspan><tspan x="60" dy="28">terminals L / N — see the</tspan><tspan x="60" dy="28">mains wiring diagram</tspan></text><rect x="410" y="205" width="44" height="20" rx="3" class="pin"></rect><text x="400" y="224.88" class="t-h t-navy t-mono" text-anchor="end"><tspan x="400" dy="0">VCC</tspan></text><g><path d="M454 215 L510 215" class="ln-thin"></path></g><g class="rb-box"><rect x="510" y="191" width="850" height="49.19999999999998" rx="10" class="box"></rect><text x="522" y="222.32" class="t-body"><tspan x="522" dy="0">4.5–5.5 V supply</tspan></text></g><rect x="410" y="287" width="44" height="20" rx="3" class="pin"></rect><text x="400" y="306.88" class="t-h t-navy t-mono" text-anchor="end"><tspan x="400" dy="0">GND</tspan></text><g><path d="M454 297 L510 297" class="ln-thin"></path></g><g class="rb-box"><rect x="510" y="273" width="850" height="49.20000000000001" rx="10" class="box"></rect><text x="522" y="304.32" class="t-body"><tspan x="522" dy="0">common ground with the master</tspan></text></g><rect x="410" y="369" width="44" height="20" rx="3" class="pin"></rect><text x="400" y="388.88" class="t-h t-navy t-mono" text-anchor="end"><tspan x="400" dy="0">SDA</tspan></text><g><path d="M454 379 L510 379" class="ln-thin"></path></g><g class="rb-box"><rect x="510" y="355" width="850" height="81.19999999999996" rx="10" class="box"></rect><text x="522" y="386.32" class="t-body"><tspan x="522" dy="0">I²C data — 3.3 V logic, 5 V tolerant; built-in pull-up behind the solder</tspan><tspan x="522" dy="32">jumper “I2C pull-up” (see pull-up rules)</tspan></text></g><rect x="410" y="451" width="44" height="20" rx="3" class="pin"></rect><text x="400" y="470.88" class="t-h t-navy t-mono" text-anchor="end"><tspan x="400" dy="0">SCL</tspan></text><g><path d="M454 461 L510 461" class="ln-thin"></path></g><g class="rb-box"><rect x="510" y="437" width="850" height="81.19999999999996" rx="10" class="box"></rect><text x="522" y="468.32" class="t-body"><tspan x="522" dy="0">I²C clock — 3.3 V logic, 5 V tolerant; 50 kHz ESP32 / ESP8266, 100</tspan><tspan x="522" dy="32">kHz other hosts</tspan></text></g><rect x="410" y="533" width="44" height="20" rx="3" class="pin"></rect><text x="400" y="552.88" class="t-h t-navy t-mono" text-anchor="end"><tspan x="400" dy="0">DRDY</tspan></text><g><path d="M454 543 L510 543" class="ln-thin"></path></g><g class="rb-box"><rect x="510" y="519" width="850" height="81.20000000000007" rx="10" class="box"></rect><text x="522" y="550.32" class="t-body"><tspan x="522" dy="0">optional. Open-drain: needs an external pull-up (e.g. 10 kΩ to the</tspan><tspan x="522" dy="32">master logic level). LOW pulse ~10 µs every ~100 ms (~10 pulses/s)</tspan></text></g></svg>