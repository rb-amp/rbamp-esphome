<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 810" width="1400" height="810" class="rb" role="img"><style>svg.rb {  --navy: #00203F;  --mint: #ADEFD1;  --body: #1a2030;  --muted: #8a9ab0;  --box: #f8f9fa;  --border: #dee2e6;  --code: #1e1e1e;  --code-fg:#e8e8e8; --white: #ffffff;  --mains: #c2410c;  --mains-bg: #fff1e8; --neutral: #1d4ed8;  --lv: #00203F;  --data: #0f766e;  --data-bg: #e6f6f2; --warn: #b45309;  --warn-bg: #fff4d6; --ok: #15803d; --ok-bg: #e3f5e8; --bad: #b91c1c; --bad-bg: #fde8e8; --ghost: #c6ccd4;   --font-sans: Inter, "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif; --font-mono: "JetBrains Mono", "SF Mono", Consolas, Menlo, "DejaVu Sans Mono", monospace; --fs-title: 34px; --fs-sub: 22px; --fs-h: 26px;  --fs-body: 24px;  --fs-small: 21px;  --fs-mono: 22px;  --stroke: 2px;  --wire: 4px;  --wire-thin:2.5px; --radius: 10px; --radius-sm:6px; } svg.rb { font-family: var(--font-sans); font-size: var(--fs-body); fill: var(--body); } svg.rb text { fill: var(--body); font-size: var(--fs-body); white-space: pre; } svg.rb .t-title { font-size: var(--fs-title); font-weight: 600; fill: var(--navy); } svg.rb .t-sub { font-size: var(--fs-sub); fill: var(--muted); } svg.rb .t-h { font-size: var(--fs-h); font-weight: 600; fill: var(--navy); } svg.rb .t-body { font-size: var(--fs-body); fill: var(--body); } svg.rb .t-small { font-size: var(--fs-small); fill: var(--muted); } svg.rb .t-muted { fill: var(--muted); } svg.rb .t-navy { fill: var(--navy); } svg.rb .t-white { fill: var(--white); } svg.rb .t-bold { font-weight: 600; } svg.rb .t-mono { font-family: var(--font-mono); font-size: var(--fs-mono); } svg.rb .t-code { font-family: var(--font-mono); font-size: var(--fs-mono); fill: var(--code-fg); } svg.rb .t-mains { fill: var(--mains); } svg.rb .t-neutral { fill: var(--neutral); } svg.rb .t-data { fill: var(--data); } svg.rb .t-warn { fill: var(--warn); } svg.rb .t-ok { fill: var(--ok); } svg.rb .t-bad { fill: var(--bad); } svg.rb .t-center { text-anchor: middle; } svg.rb .t-right { text-anchor: end; } svg.rb .t-ink { fill: var(--body); }   svg.rb .box { fill: var(--box); stroke: var(--border); stroke-width: var(--stroke); } svg.rb .box-white { fill: var(--white); stroke: var(--border); stroke-width: var(--stroke); } svg.rb .box-navy { fill: var(--navy); stroke: var(--navy); stroke-width: var(--stroke); } svg.rb .box-code { fill: var(--code); stroke: var(--code); stroke-width: var(--stroke); } svg.rb .box-warn { fill: var(--warn-bg); stroke: var(--warn); stroke-width: var(--stroke); } svg.rb .box-ok { fill: var(--ok-bg); stroke: var(--ok); stroke-width: var(--stroke); } svg.rb .box-bad { fill: var(--bad-bg); stroke: var(--bad); stroke-width: var(--stroke); } svg.rb .box-data { fill: var(--data-bg); stroke: var(--data); stroke-width: var(--stroke); } svg.rb .box-mains { fill: var(--mains-bg); stroke: var(--mains); stroke-width: var(--stroke); } svg.rb .box-mint { fill: var(--mint); stroke: var(--mint); stroke-width: var(--stroke); } svg.rb .box-ghost { fill: none; stroke: var(--ghost); stroke-width: var(--stroke); stroke-dasharray: 8 6; } svg.rb .box-dashed { fill: none; stroke: var(--muted); stroke-width: var(--stroke); stroke-dasharray: 10 7; } svg.rb .box-outline{ fill: none; stroke: var(--navy); stroke-width: var(--stroke); }  svg.rb .ln { fill: none; stroke: var(--navy); stroke-width: var(--wire); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-thin { fill: none; stroke: var(--navy); stroke-width: var(--wire-thin); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-muted { fill: none; stroke: var(--muted); stroke-width: var(--wire-thin); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-mains { fill: none; stroke: var(--mains); stroke-width: var(--wire); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-neutral{ fill: none; stroke: var(--neutral); stroke-width: var(--wire); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-data { fill: none; stroke: var(--data); stroke-width: var(--wire-thin); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-ok { fill: none; stroke: var(--ok); stroke-width: var(--wire); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-bad { fill: none; stroke: var(--bad); stroke-width: var(--wire); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-warn { fill: none; stroke: var(--warn); stroke-width: var(--wire); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-ghost { fill: none; stroke: var(--ghost); stroke-width: var(--wire-thin); stroke-linecap: round; stroke-dasharray: 8 6; } svg.rb .dash { stroke-dasharray: 10 7; } svg.rb .dash-sm { stroke-dasharray: 4 5; }  svg.rb .ah { fill: var(--mint); stroke: var(--navy); stroke-width: 1.5px; stroke-linejoin: round; } svg.rb .ah-navy { fill: var(--navy); stroke: var(--navy); stroke-width: 1.5px; } svg.rb .ah-muted { fill: var(--muted); stroke: var(--muted); } svg.rb .ah-mains { fill: var(--mains); stroke: var(--mains); } svg.rb .ah-neutral{ fill: var(--neutral); stroke: var(--neutral); } svg.rb .ah-data { fill: var(--data); stroke: var(--data); } svg.rb .ah-ok { fill: var(--ok); stroke: var(--ok); } svg.rb .ah-bad { fill: var(--bad); stroke: var(--bad); } svg.rb .ah-warn { fill: var(--warn); stroke: var(--warn); } svg.rb .ah-ghost { fill: var(--ghost); stroke: var(--ghost); }  svg.rb .clamp { fill: var(--white); stroke: var(--navy); stroke-width: var(--wire); } svg.rb .clamp-gap { stroke: var(--white); stroke-width: 6px; } svg.rb .terminal { fill: var(--white); stroke: var(--navy); stroke-width: var(--stroke); } svg.rb .pin { fill: var(--navy); } svg.rb .pin-ghost { fill: var(--ghost); } svg.rb .dot { fill: var(--navy); } svg.rb .dot-mains { fill: var(--mains); } svg.rb .dot-neutral { fill: var(--neutral); } svg.rb .dot-white { fill: var(--white); } svg.rb .dot-mint { fill: var(--mint); } svg.rb .tri { fill: var(--warn-bg); stroke: var(--warn); stroke-width: 3px; stroke-linejoin: round; } svg.rb .tri-mark { fill: var(--warn); } svg.rb .cross { stroke: var(--bad); stroke-width: 5px; stroke-linecap: round; } svg.rb .tick { fill: none; stroke: var(--ok); stroke-width: 5px; stroke-linecap: round; stroke-linejoin: round; } svg.rb .hatch { stroke: var(--ghost); stroke-width: 2px; }</style><title>Real-time window and the atomic result block</title><text x="40" y="69.92" class="t-title"><tspan x="40" dy="0">Real-time window and the atomic result block</tspan></text><text x="40" y="164.88" class="t-h"><tspan x="40" dy="0">Measurement</tspan><tspan x="40" dy="34">window</tspan></text><text x="40" y="232.38" class="t-small"><tspan x="40" dy="0">100 ms, continuous,</tspan><tspan x="40" dy="28">back-to-back, no gap</tspan><tspan x="40" dy="28">5 mains cycles @ 50 Hz /</tspan><tspan x="40" dy="28">6 @ 60 Hz</tspan></text><rect x="360" y="150" width="186" height="60" class="box-white" rx="0"></rect><text x="453" y="176.48" class="t-small t-navy t-bold" text-anchor="middle"><tspan x="453" dy="0">window 1</tspan></text><text x="453" y="200.48" class="t-small t-muted" text-anchor="middle"><tspan x="453" dy="0">100 ms</tspan></text><rect x="546" y="150" width="186" height="60" class="box" rx="0"></rect><text x="639" y="176.48" class="t-small t-navy t-bold" text-anchor="middle"><tspan x="639" dy="0">window 2</tspan></text><text x="639" y="200.48" class="t-small t-muted" text-anchor="middle"><tspan x="639" dy="0">100 ms</tspan></text><rect x="732" y="150" width="186" height="60" class="box-white" rx="0"></rect><text x="825" y="176.48" class="t-small t-navy t-bold" text-anchor="middle"><tspan x="825" dy="0">window 3</tspan></text><text x="825" y="200.48" class="t-small t-muted" text-anchor="middle"><tspan x="825" dy="0">100 ms</tspan></text><rect x="918" y="150" width="186" height="60" class="box" rx="0"></rect><text x="1011" y="176.48" class="t-small t-navy t-bold" text-anchor="middle"><tspan x="1011" dy="0">window 4</tspan></text><text x="1011" y="200.48" class="t-small t-muted" text-anchor="middle"><tspan x="1011" dy="0">100 ms</tspan></text><rect x="1104" y="150" width="186" height="60" class="box-white" rx="0"></rect><text x="1197" y="176.48" class="t-small t-navy t-bold" text-anchor="middle"><tspan x="1197" dy="0">window 5</tspan></text><text x="1197" y="200.48" class="t-small t-muted" text-anchor="middle"><tspan x="1197" dy="0">100 ms</tspan></text><text x="1302" y="186.88" class="t-h t-muted"><tspan x="1302" dy="0">···</tspan></text><text x="40" y="372.88" class="t-h"><tspan x="40" dy="0">DRDY (open-drain)</tspan></text><text x="40" y="406.38" class="t-small"><tspan x="40" dy="0">LOW pulse ~10 µs once</tspan><tspan x="40" dy="28">per window</tspan><tspan x="40" dy="28">~10 pulses/s</tspan></text><g><path d="M360 370 L538 370 L538 400 L544 400 L544 370 L724 370 L724 400 L730 400 L730 370 L910 370 L910 400 L916 400 L916 370 L1096 370 L1096 400 L1102 400 L1102 370 L1282 370 L1282 400 L1288 400 L1288 370 L1330 370" class="ln-data"></path></g><text x="352" y="376.48" class="t-small t-muted" text-anchor="end"><tspan x="352" dy="0">HIGH</tspan></text><text x="352" y="406.48" class="t-small t-muted" text-anchor="end"><tspan x="352" dy="0">LOW</tspan></text><text x="40" y="502.88" class="t-h"><tspan x="40" dy="0">Master burst read</tspan></text><text x="40" y="536.38" class="t-small"><tspan x="40" dy="0">any time after DRDY,</tspan><tspan x="40" dy="28">before the next window</tspan><tspan x="40" dy="28">ends</tspan></text><rect x="548" y="500" width="182" height="44" class="box-data" rx="6"></rect><text x="639" y="528.48" class="t-small t-data t-bold" text-anchor="middle"><tspan x="639" dy="0">result 1</tspan></text><rect x="734" y="500" width="182" height="44" class="box-data" rx="6"></rect><text x="825" y="528.48" class="t-small t-data t-bold" text-anchor="middle"><tspan x="825" dy="0">result 2</tspan></text><rect x="920" y="500" width="182" height="44" class="box-data" rx="6"></rect><text x="1011" y="528.48" class="t-small t-data t-bold" text-anchor="middle"><tspan x="1011" dy="0">result 3</tspan></text><rect x="1106" y="500" width="182" height="44" class="box-data" rx="6"></rect><text x="1197" y="528.48" class="t-small t-data t-bold" text-anchor="middle"><tspan x="1197" dy="0">result 4</tspan></text><g><path d="M772 544 L772 600" class="ln-data"></path><path d="M0 0 L-13 -6.5 L-9.36 0 L-13 6.5 Z" class="ah-data" transform="translate(772 600) rotate(90)"></path></g><g class="rb-box"><rect x="360" y="604" width="1000" height="116.7" rx="10" class="box-white"></rect><text x="376" y="638.72" class="t-body t-bold"><tspan x="376" dy="0">atomic block 0x86..0xBD — 56 bytes, one burst read</tspan></text><text x="376" y="669.6800000000001" class="t-small t-navy t-mono"><tspan x="376" dy="0">full result set 0x86..0xCD</tspan></text><text x="376" y="699.83" class="t-small"><tspan x="376" dy="0">the block never changes in the middle of a read: it is swapped whole at the window boundary</tspan></text></g><text x="40" y="763.1800000000001" class="t-small t-muted"><tspan x="40" dy="0">firmware images before v1.2: 200 ms window</tspan></text></svg>