<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 630" width="1400" height="630" class="rb" role="img"><style>svg.rb {  --navy: #00203F;  --mint: #ADEFD1;  --body: #1a2030;  --muted: #8a9ab0;  --box: #f8f9fa;  --border: #dee2e6;  --code: #1e1e1e;  --code-fg:#e8e8e8; --white: #ffffff;  --mains: #c2410c;  --mains-bg: #fff1e8; --neutral: #1d4ed8;  --lv: #00203F;  --data: #0f766e;  --data-bg: #e6f6f2; --warn: #b45309;  --warn-bg: #fff4d6; --ok: #15803d; --ok-bg: #e3f5e8; --bad: #b91c1c; --bad-bg: #fde8e8; --ghost: #c6ccd4;   --font-sans: Inter, "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif; --font-mono: "JetBrains Mono", "SF Mono", Consolas, Menlo, "DejaVu Sans Mono", monospace; --fs-title: 34px; --fs-sub: 22px; --fs-h: 26px;  --fs-body: 24px;  --fs-small: 21px;  --fs-mono: 22px;  --stroke: 2px;  --wire: 4px;  --wire-thin:2.5px; --radius: 10px; --radius-sm:6px; } svg.rb { font-family: var(--font-sans); font-size: var(--fs-body); fill: var(--body); } svg.rb text { fill: var(--body); font-size: var(--fs-body); white-space: pre; } svg.rb .t-title { font-size: var(--fs-title); font-weight: 600; fill: var(--navy); } svg.rb .t-sub { font-size: var(--fs-sub); fill: var(--muted); } svg.rb .t-h { font-size: var(--fs-h); font-weight: 600; fill: var(--navy); } svg.rb .t-body { font-size: var(--fs-body); fill: var(--body); } svg.rb .t-small { font-size: var(--fs-small); fill: var(--muted); } svg.rb .t-muted { fill: var(--muted); } svg.rb .t-navy { fill: var(--navy); } svg.rb .t-white { fill: var(--white); } svg.rb .t-bold { font-weight: 600; } svg.rb .t-mono { font-family: var(--font-mono); font-size: var(--fs-mono); } svg.rb .t-code { font-family: var(--font-mono); font-size: var(--fs-mono); fill: var(--code-fg); } svg.rb .t-mains { fill: var(--mains); } svg.rb .t-neutral { fill: var(--neutral); } svg.rb .t-data { fill: var(--data); } svg.rb .t-warn { fill: var(--warn); } svg.rb .t-ok { fill: var(--ok); } svg.rb .t-bad { fill: var(--bad); } svg.rb .t-center { text-anchor: middle; } svg.rb .t-right { text-anchor: end; } svg.rb .t-ink { fill: var(--body); }   svg.rb .box { fill: var(--box); stroke: var(--border); stroke-width: var(--stroke); } svg.rb .box-white { fill: var(--white); stroke: var(--border); stroke-width: var(--stroke); } svg.rb .box-navy { fill: var(--navy); stroke: var(--navy); stroke-width: var(--stroke); } svg.rb .box-code { fill: var(--code); stroke: var(--code); stroke-width: var(--stroke); } svg.rb .box-warn { fill: var(--warn-bg); stroke: var(--warn); stroke-width: var(--stroke); } svg.rb .box-ok { fill: var(--ok-bg); stroke: var(--ok); stroke-width: var(--stroke); } svg.rb .box-bad { fill: var(--bad-bg); stroke: var(--bad); stroke-width: var(--stroke); } svg.rb .box-data { fill: var(--data-bg); stroke: var(--data); stroke-width: var(--stroke); } svg.rb .box-mains { fill: var(--mains-bg); stroke: var(--mains); stroke-width: var(--stroke); } svg.rb .box-mint { fill: var(--mint); stroke: var(--mint); stroke-width: var(--stroke); } svg.rb .box-ghost { fill: none; stroke: var(--ghost); stroke-width: var(--stroke); stroke-dasharray: 8 6; } svg.rb .box-dashed { fill: none; stroke: var(--muted); stroke-width: var(--stroke); stroke-dasharray: 10 7; } svg.rb .box-outline{ fill: none; stroke: var(--navy); stroke-width: var(--stroke); }  svg.rb .ln { fill: none; stroke: var(--navy); stroke-width: var(--wire); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-thin { fill: none; stroke: var(--navy); stroke-width: var(--wire-thin); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-muted { fill: none; stroke: var(--muted); stroke-width: var(--wire-thin); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-mains { fill: none; stroke: var(--mains); stroke-width: var(--wire); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-neutral{ fill: none; stroke: var(--neutral); stroke-width: var(--wire); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-data { fill: none; stroke: var(--data); stroke-width: var(--wire-thin); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-ok { fill: none; stroke: var(--ok); stroke-width: var(--wire); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-bad { fill: none; stroke: var(--bad); stroke-width: var(--wire); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-warn { fill: none; stroke: var(--warn); stroke-width: var(--wire); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-ghost { fill: none; stroke: var(--ghost); stroke-width: var(--wire-thin); stroke-linecap: round; stroke-dasharray: 8 6; } svg.rb .dash { stroke-dasharray: 10 7; } svg.rb .dash-sm { stroke-dasharray: 4 5; }  svg.rb .ah { fill: var(--mint); stroke: var(--navy); stroke-width: 1.5px; stroke-linejoin: round; } svg.rb .ah-navy { fill: var(--navy); stroke: var(--navy); stroke-width: 1.5px; } svg.rb .ah-muted { fill: var(--muted); stroke: var(--muted); } svg.rb .ah-mains { fill: var(--mains); stroke: var(--mains); } svg.rb .ah-neutral{ fill: var(--neutral); stroke: var(--neutral); } svg.rb .ah-data { fill: var(--data); stroke: var(--data); } svg.rb .ah-ok { fill: var(--ok); stroke: var(--ok); } svg.rb .ah-bad { fill: var(--bad); stroke: var(--bad); } svg.rb .ah-warn { fill: var(--warn); stroke: var(--warn); } svg.rb .ah-ghost { fill: var(--ghost); stroke: var(--ghost); }  svg.rb .clamp { fill: var(--white); stroke: var(--navy); stroke-width: var(--wire); } svg.rb .clamp-gap { stroke: var(--white); stroke-width: 6px; } svg.rb .terminal { fill: var(--white); stroke: var(--navy); stroke-width: var(--stroke); } svg.rb .pin { fill: var(--navy); } svg.rb .pin-ghost { fill: var(--ghost); } svg.rb .dot { fill: var(--navy); } svg.rb .dot-mains { fill: var(--mains); } svg.rb .dot-neutral { fill: var(--neutral); } svg.rb .dot-white { fill: var(--white); } svg.rb .dot-mint { fill: var(--mint); } svg.rb .tri { fill: var(--warn-bg); stroke: var(--warn); stroke-width: 3px; stroke-linejoin: round; } svg.rb .tri-mark { fill: var(--warn); } svg.rb .cross { stroke: var(--bad); stroke-width: 5px; stroke-linecap: round; } svg.rb .tick { fill: none; stroke: var(--ok); stroke-width: 5px; stroke-linecap: round; stroke-linejoin: round; } svg.rb .hatch { stroke: var(--ghost); stroke-width: 2px; }</style><title>Changing a module address: two-phase write, then reset and verify</title><text x="40" y="69.92" class="t-title"><tspan x="40" dy="0">Changing a module address: two-phase write, then reset and verify</tspan></text><g class="rb-box"><rect x="40" y="150" width="300" height="130" rx="10" class="box-outline"></rect><text x="54" y="183.02" class="t-body t-bold t-navy"><tspan x="54" dy="0">1  stage</tspan></text><text x="54" y="211.98" class="t-small t-ink"><tspan x="54" dy="0">write the new address →</tspan><tspan x="54" dy="28">0x30</tspan></text></g><g class="rb-box"><rect x="370" y="150" width="300" height="130" rx="10" class="box-outline"></rect><text x="384" y="183.02" class="t-body t-bold t-navy"><tspan x="384" dy="0">2  arm</tspan></text><text x="384" y="211.98" class="t-small t-ink"><tspan x="384" dy="0">write 0xA5 → 0x31</tspan></text></g><g class="rb-box"><rect x="700" y="150" width="300" height="130" rx="10" class="box-outline"></rect><text x="714" y="183.02" class="t-body t-bold t-navy"><tspan x="714" dy="0">3  commit</tspan></text><text x="714" y="211.98" class="t-small t-ink"><tspan x="714" dy="0">the module accepts the</tspan><tspan x="714" dy="28">staged address</tspan></text></g><g class="rb-box"><rect x="1030" y="150" width="300" height="130" rx="10" class="box-dashed"></rect><text x="1044" y="183.02" class="t-body t-bold t-navy"><tspan x="1044" dy="0">4  wait ≥ 700 ms</tspan></text><text x="1044" y="211.98" class="t-small t-ink"><tspan x="1044" dy="0">the module stores it</tspan></text></g><g class="rb-box"><rect x="40" y="360" width="300" height="130" rx="10" class="box-outline"></rect><text x="54" y="393.02" class="t-body t-bold t-navy"><tspan x="54" dy="0">5  reset</tspan></text><text x="54" y="421.98" class="t-small t-ink"><tspan x="54" dy="0">the module restarts with</tspan><tspan x="54" dy="28">the new address</tspan></text></g><g class="rb-box"><rect x="370" y="360" width="300" height="130" rx="10" class="box-dashed"></rect><text x="384" y="393.02" class="t-body t-bold t-navy"><tspan x="384" dy="0">6  wait ~300 ms</tspan></text><text x="384" y="421.98" class="t-small t-ink"><tspan x="384" dy="0">boot</tspan></text></g><g class="rb-box"><rect x="700" y="360" width="300" height="130" rx="10" class="box-ok"></rect><text x="714" y="393.02" class="t-body t-bold t-ok"><tspan x="714" dy="0">7  verify</tspan></text><text x="714" y="421.98" class="t-small t-ink"><tspan x="714" dy="0">read VERSION at the new</tspan><tspan x="714" dy="28">address → 0x04</tspan></text></g><g><path d="M340 215 L370 215" class="ln"></path><path d="M0 0 L-16 -8 L-11.52 0 L-16 8 Z" class="ah" transform="translate(370 215) rotate(0)"></path></g><g><path d="M670 215 L700 215" class="ln"></path><path d="M0 0 L-16 -8 L-11.52 0 L-16 8 Z" class="ah" transform="translate(700 215) rotate(0)"></path></g><g><path d="M1000 215 L1030 215" class="ln"></path><path d="M0 0 L-16 -8 L-11.52 0 L-16 8 Z" class="ah" transform="translate(1030 215) rotate(0)"></path></g><g><path d="M1180 280 L1180 320 L190 320 L190 360" class="ln"></path><path d="M0 0 L-16 -8 L-11.52 0 L-16 8 Z" class="ah" transform="translate(190 360) rotate(90)"></path></g><g><path d="M340 425 L370 425" class="ln"></path><path d="M0 0 L-16 -8 L-11.52 0 L-16 8 Z" class="ah" transform="translate(370 425) rotate(0)"></path></g><g><path d="M670 425 L700 425" class="ln"></path><path d="M0 0 L-16 -8 L-11.52 0 L-16 8 Z" class="ah" transform="translate(700 425) rotate(0)"></path></g><g class="rb-box"><rect x="1030" y="360" width="300" height="133.34999999999997" rx="10" class="box"></rect><text x="1044" y="390.38" class="t-small t-ink"><tspan x="1044" dy="0">The client libraries do all</tspan><tspan x="1044" dy="28">seven steps for you: the</tspan><tspan x="1044" dy="28">provision call (desired</tspan><tspan x="1044" dy="28">address, save).</tspan></text></g><g><rect x="40" y="533.3499999999999" width="1320" height="56" rx="10" class="box-bad"></rect><text x="106" y="568.4699999999999" class="t-body t-bad t-bold"><tspan x="106" dy="0">Exactly ONE virgin module (0x50) on the bus at a time — two at 0x50 = address collision.</tspan></text><g><path d="M74 542.6499999999999 L93.72 576.6499999999999 L54.28 576.6499999999999 Z" class="tri" style="fill:var(--bad-bg);stroke:var(--bad)"></path><rect x="71.96" y="554.55" width="4.08" height="12.24" rx="2" class="tri-mark" style="fill:var(--bad)"></rect><circle cx="74" cy="571.55" r="2.3800000000000003" class="tri-mark" style="fill:var(--bad)"></circle></g></g></svg>