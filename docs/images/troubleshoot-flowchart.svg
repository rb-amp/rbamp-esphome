<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 982" width="1400" height="982" class="rb" role="img"><style>svg.rb {  --navy: #00203F;  --mint: #ADEFD1;  --body: #1a2030;  --muted: #8a9ab0;  --box: #f8f9fa;  --border: #dee2e6;  --code: #1e1e1e;  --code-fg:#e8e8e8; --white: #ffffff;  --mains: #c2410c;  --mains-bg: #fff1e8; --neutral: #1d4ed8;  --lv: #00203F;  --data: #0f766e;  --data-bg: #e6f6f2; --warn: #b45309;  --warn-bg: #fff4d6; --ok: #15803d; --ok-bg: #e3f5e8; --bad: #b91c1c; --bad-bg: #fde8e8; --ghost: #c6ccd4;   --font-sans: Inter, "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif; --font-mono: "JetBrains Mono", "SF Mono", Consolas, Menlo, "DejaVu Sans Mono", monospace; --fs-title: 34px; --fs-sub: 22px; --fs-h: 26px;  --fs-body: 24px;  --fs-small: 21px;  --fs-mono: 22px;  --stroke: 2px;  --wire: 4px;  --wire-thin:2.5px; --radius: 10px; --radius-sm:6px; } svg.rb { font-family: var(--font-sans); font-size: var(--fs-body); fill: var(--body); } svg.rb text { fill: var(--body); font-size: var(--fs-body); white-space: pre; } svg.rb .t-title { font-size: var(--fs-title); font-weight: 600; fill: var(--navy); } svg.rb .t-sub { font-size: var(--fs-sub); fill: var(--muted); } svg.rb .t-h { font-size: var(--fs-h); font-weight: 600; fill: var(--navy); } svg.rb .t-body { font-size: var(--fs-body); fill: var(--body); } svg.rb .t-small { font-size: var(--fs-small); fill: var(--muted); } svg.rb .t-muted { fill: var(--muted); } svg.rb .t-navy { fill: var(--navy); } svg.rb .t-white { fill: var(--white); } svg.rb .t-bold { font-weight: 600; } svg.rb .t-mono { font-family: var(--font-mono); font-size: var(--fs-mono); } svg.rb .t-code { font-family: var(--font-mono); font-size: var(--fs-mono); fill: var(--code-fg); } svg.rb .t-mains { fill: var(--mains); } svg.rb .t-neutral { fill: var(--neutral); } svg.rb .t-data { fill: var(--data); } svg.rb .t-warn { fill: var(--warn); } svg.rb .t-ok { fill: var(--ok); } svg.rb .t-bad { fill: var(--bad); } svg.rb .t-center { text-anchor: middle; } svg.rb .t-right { text-anchor: end; } svg.rb .t-ink { fill: var(--body); }   svg.rb .box { fill: var(--box); stroke: var(--border); stroke-width: var(--stroke); } svg.rb .box-white { fill: var(--white); stroke: var(--border); stroke-width: var(--stroke); } svg.rb .box-navy { fill: var(--navy); stroke: var(--navy); stroke-width: var(--stroke); } svg.rb .box-code { fill: var(--code); stroke: var(--code); stroke-width: var(--stroke); } svg.rb .box-warn { fill: var(--warn-bg); stroke: var(--warn); stroke-width: var(--stroke); } svg.rb .box-ok { fill: var(--ok-bg); stroke: var(--ok); stroke-width: var(--stroke); } svg.rb .box-bad { fill: var(--bad-bg); stroke: var(--bad); stroke-width: var(--stroke); } svg.rb .box-data { fill: var(--data-bg); stroke: var(--data); stroke-width: var(--stroke); } svg.rb .box-mains { fill: var(--mains-bg); stroke: var(--mains); stroke-width: var(--stroke); } svg.rb .box-mint { fill: var(--mint); stroke: var(--mint); stroke-width: var(--stroke); } svg.rb .box-ghost { fill: none; stroke: var(--ghost); stroke-width: var(--stroke); stroke-dasharray: 8 6; } svg.rb .box-dashed { fill: none; stroke: var(--muted); stroke-width: var(--stroke); stroke-dasharray: 10 7; } svg.rb .box-outline{ fill: none; stroke: var(--navy); stroke-width: var(--stroke); }  svg.rb .ln { fill: none; stroke: var(--navy); stroke-width: var(--wire); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-thin { fill: none; stroke: var(--navy); stroke-width: var(--wire-thin); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-muted { fill: none; stroke: var(--muted); stroke-width: var(--wire-thin); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-mains { fill: none; stroke: var(--mains); stroke-width: var(--wire); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-neutral{ fill: none; stroke: var(--neutral); stroke-width: var(--wire); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-data { fill: none; stroke: var(--data); stroke-width: var(--wire-thin); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-ok { fill: none; stroke: var(--ok); stroke-width: var(--wire); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-bad { fill: none; stroke: var(--bad); stroke-width: var(--wire); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-warn { fill: none; stroke: var(--warn); stroke-width: var(--wire); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-ghost { fill: none; stroke: var(--ghost); stroke-width: var(--wire-thin); stroke-linecap: round; stroke-dasharray: 8 6; } svg.rb .dash { stroke-dasharray: 10 7; } svg.rb .dash-sm { stroke-dasharray: 4 5; }  svg.rb .ah { fill: var(--mint); stroke: var(--navy); stroke-width: 1.5px; stroke-linejoin: round; } svg.rb .ah-navy { fill: var(--navy); stroke: var(--navy); stroke-width: 1.5px; } svg.rb .ah-muted { fill: var(--muted); stroke: var(--muted); } svg.rb .ah-mains { fill: var(--mains); stroke: var(--mains); } svg.rb .ah-neutral{ fill: var(--neutral); stroke: var(--neutral); } svg.rb .ah-data { fill: var(--data); stroke: var(--data); } svg.rb .ah-ok { fill: var(--ok); stroke: var(--ok); } svg.rb .ah-bad { fill: var(--bad); stroke: var(--bad); } svg.rb .ah-warn { fill: var(--warn); stroke: var(--warn); } svg.rb .ah-ghost { fill: var(--ghost); stroke: var(--ghost); }  svg.rb .clamp { fill: var(--white); stroke: var(--navy); stroke-width: var(--wire); } svg.rb .clamp-gap { stroke: var(--white); stroke-width: 6px; } svg.rb .terminal { fill: var(--white); stroke: var(--navy); stroke-width: var(--stroke); } svg.rb .pin { fill: var(--navy); } svg.rb .pin-ghost { fill: var(--ghost); } svg.rb .dot { fill: var(--navy); } svg.rb .dot-mains { fill: var(--mains); } svg.rb .dot-neutral { fill: var(--neutral); } svg.rb .dot-white { fill: var(--white); } svg.rb .dot-mint { fill: var(--mint); } svg.rb .tri { fill: var(--warn-bg); stroke: var(--warn); stroke-width: 3px; stroke-linejoin: round; } svg.rb .tri-mark { fill: var(--warn); } svg.rb .cross { stroke: var(--bad); stroke-width: 5px; stroke-linecap: round; } svg.rb .tick { fill: none; stroke: var(--ok); stroke-width: 5px; stroke-linecap: round; stroke-linejoin: round; } svg.rb .hatch { stroke: var(--ghost); stroke-width: 2px; }</style><title>Troubleshooting: five symptom families</title><text x="40" y="69.92" class="t-title"><tspan x="40" dy="0">Troubleshooting: five symptom families</tspan></text><g class="rb-box"><rect x="40" y="130" width="250" height="96" rx="10" class="box-navy"></rect><text x="54" y="163.02" class="t-body t-white "><tspan x="54" dy="0">No answer at 0x50</tspan><tspan x="54" dy="32">(NACK)</tspan></text></g><g class="rb-box"><rect x="40" y="252" width="250" height="129.75000000000003" rx="10" class="box-white"></rect><text x="52" y="280.68" class="t-small t-ink"><tspan x="52" dy="0">VCC 4.5–5.0 V,</tspan><tspan x="52" dy="28">common GND,</tspan><tspan x="52" dy="28">SDA/SCL not</tspan><tspan x="52" dy="28">swapped</tspan></text></g><g><path d="M165 226 L165 252" class="ln-thin"></path><path d="M0 0 L-12 -6 L-8.64 0 L-12 6 Z" class="ah" transform="translate(165 252) rotate(90)"></path></g><g class="rb-box"><rect x="40" y="407.75" width="250" height="129.75000000000003" rx="10" class="box-white"></rect><text x="52" y="436.43" class="t-small t-ink"><tspan x="52" dy="0">pull-ups: 1 module</tspan><tspan x="52" dy="28">built-in, 3+ one</tspan><tspan x="52" dy="28">external pair 2.7–3.3</tspan><tspan x="52" dy="28">kΩ</tspan></text></g><g><path d="M165 381.75 L165 407.75" class="ln-thin"></path><path d="M0 0 L-12 -6 L-8.64 0 L-12 6 Z" class="ah" transform="translate(165 407.75) rotate(90)"></path></g><g class="rb-box"><rect x="40" y="563.5" width="250" height="101.75000000000003" rx="10" class="box-white"></rect><text x="52" y="592.1800000000001" class="t-small t-ink"><tspan x="52" dy="0">bus speed 50 kHz</tspan><tspan x="52" dy="28">(ESP32) / 100 kHz —</tspan><tspan x="52" dy="28">never 400 kHz</tspan></text></g><g><path d="M165 537.5 L165 563.5" class="ln-thin"></path><path d="M0 0 L-12 -6 L-8.64 0 L-12 6 Z" class="ah" transform="translate(165 563.5) rotate(90)"></path></g><g class="rb-box"><rect x="40" y="691.25" width="250" height="73.75000000000003" rx="10" class="box-white"></rect><text x="52" y="719.9300000000001" class="t-small t-ink"><tspan x="52" dy="0">address changed</tspan><tspan x="52" dy="28">earlier? scan the bus</tspan></text></g><g><path d="M165 665.25 L165 691.25" class="ln-thin"></path><path d="M0 0 L-12 -6 L-8.64 0 L-12 6 Z" class="ah" transform="translate(165 691.25) rotate(90)"></path></g><g class="rb-box"><rect x="307.5" y="130" width="250" height="96" rx="10" class="box-navy"></rect><text x="321.5" y="163.02" class="t-body t-white "><tspan x="321.5" dy="0">Current reads ≈ 0</tspan><tspan x="321.5" dy="32">or wrong sign</tspan></text></g><g class="rb-box"><rect x="307.5" y="252" width="250" height="101.75000000000003" rx="10" class="box-white"></rect><text x="319.5" y="280.68" class="t-small t-ink"><tspan x="319.5" dy="0">clamp on ONE</tspan><tspan x="319.5" dy="28">conductor — L only,</tspan><tspan x="319.5" dy="28">never L+N</tspan></text></g><g><path d="M432.5 226 L432.5 252" class="ln-thin"></path><path d="M0 0 L-12 -6 L-8.64 0 L-12 6 Z" class="ah" transform="translate(432.5 252) rotate(90)"></path></g><g class="rb-box"><rect x="307.5" y="379.75" width="250" height="101.75000000000003" rx="10" class="box-white"></rect><text x="319.5" y="408.43" class="t-small t-ink"><tspan x="319.5" dy="0">clamp fully closed,</tspan><tspan x="319.5" dy="28">jack fully inserted in</tspan><tspan x="319.5" dy="28">I0</tspan></text></g><g><path d="M432.5 353.75 L432.5 379.75" class="ln-thin"></path><path d="M0 0 L-12 -6 L-8.64 0 L-12 6 Z" class="ah" transform="translate(432.5 379.75) rotate(90)"></path></g><g class="rb-box"><rect x="307.5" y="507.5" width="250" height="129.75000000000003" rx="10" class="box-white"></rect><text x="319.5" y="536.1800000000001" class="t-small t-ink"><tspan x="319.5" dy="0">arrow toward the</tspan><tspan x="319.5" dy="28">load; P &lt; 0 on a</tspan><tspan x="319.5" dy="28">resistive load → turn</tspan><tspan x="319.5" dy="28">the clamp</tspan></text></g><g><path d="M432.5 481.5 L432.5 507.5" class="ln-thin"></path><path d="M0 0 L-12 -6 L-8.64 0 L-12 6 Z" class="ah" transform="translate(432.5 507.5) rotate(90)"></path></g><g class="rb-box"><rect x="307.5" y="663.25" width="250" height="101.75000000000003" rx="10" class="box-white"></rect><text x="319.5" y="691.9300000000001" class="t-small t-ink"><tspan x="319.5" dy="0">SCT-013: CT model</tspan><tspan x="319.5" dy="28">code 1..7 matches the</tspan><tspan x="319.5" dy="28">clamp</tspan></text></g><g><path d="M432.5 637.25 L432.5 663.25" class="ln-thin"></path><path d="M0 0 L-12 -6 L-8.64 0 L-12 6 Z" class="ah" transform="translate(432.5 663.25) rotate(90)"></path></g><g class="rb-box"><rect x="575" y="130" width="250" height="96" rx="10" class="box-navy"></rect><text x="589" y="163.02" class="t-body t-white "><tspan x="589" dy="0">Readings noisy or</tspan><tspan x="589" dy="32">low</tspan></text></g><g class="rb-box"><rect x="575" y="252" width="250" height="101.75000000000003" rx="10" class="box-white"></rect><text x="587" y="280.68" class="t-small t-ink"><tspan x="587" dy="0">clamp rating far</tspan><tspan x="587" dy="28">above the current →</tspan><tspan x="587" dy="28">noisy at low current</tspan></text></g><g><path d="M700 226 L700 252" class="ln-thin"></path><path d="M0 0 L-12 -6 L-8.64 0 L-12 6 Z" class="ah" transform="translate(700 252) rotate(90)"></path></g><g class="rb-box"><rect x="575" y="379.75" width="250" height="101.75000000000003" rx="10" class="box-white"></rect><text x="587" y="408.43" class="t-small t-ink"><tspan x="587" dy="0">clamp too small →</tspan><tspan x="587" dy="28">clips at ≈115–120 % of</tspan><tspan x="587" dy="28">rating, reads low</tspan></text></g><g><path d="M700 353.75 L700 379.75" class="ln-thin"></path><path d="M0 0 L-12 -6 L-8.64 0 L-12 6 Z" class="ah" transform="translate(700 379.75) rotate(90)"></path></g><g class="rb-box"><rect x="575" y="507.5" width="250" height="73.75000000000003" rx="10" class="box-white"></rect><text x="587" y="536.1800000000001" class="t-small t-ink"><tspan x="587" dy="0">sensor class set for a</tspan><tspan x="587" dy="28">user-supplied clamp</tspan></text></g><g><path d="M700 481.5 L700 507.5" class="ln-thin"></path><path d="M0 0 L-12 -6 L-8.64 0 L-12 6 Z" class="ah" transform="translate(700 507.5) rotate(90)"></path></g><g class="rb-box"><rect x="842.5" y="130" width="250" height="96" rx="10" class="box-navy"></rect><text x="856.5" y="163.02" class="t-body t-white "><tspan x="856.5" dy="0">PF or power looks</tspan><tspan x="856.5" dy="32">wrong</tspan></text></g><g class="rb-box"><rect x="842.5" y="252" width="250" height="101.75000000000003" rx="10" class="box-white"></rect><text x="854.5" y="280.68" class="t-small t-ink"><tspan x="854.5" dy="0">sanity check:</tspan><tspan x="854.5" dy="28">resistive load → PF ≈</tspan><tspan x="854.5" dy="28">1, P &gt; 0</tspan></text></g><g><path d="M967.5 226 L967.5 252" class="ln-thin"></path><path d="M0 0 L-12 -6 L-8.64 0 L-12 6 Z" class="ah" transform="translate(967.5 252) rotate(90)"></path></g><g class="rb-box"><rect x="842.5" y="379.75" width="250" height="101.75000000000003" rx="10" class="box-white"></rect><text x="854.5" y="408.43" class="t-small t-ink"><tspan x="854.5" dy="0">read the result block</tspan><tspan x="854.5" dy="28">after DRDY /</tspan><tspan x="854.5" dy="28">DATA_VALID (0xCE)</tspan></text></g><g><path d="M967.5 353.75 L967.5 379.75" class="ln-thin"></path><path d="M0 0 L-12 -6 L-8.64 0 L-12 6 Z" class="ah" transform="translate(967.5 379.75) rotate(90)"></path></g><g class="rb-box"><rect x="842.5" y="507.5" width="250" height="101.75000000000003" rx="10" class="box-white"></rect><text x="854.5" y="536.1800000000001" class="t-small t-ink"><tspan x="854.5" dy="0">mains reference tap</tspan><tspan x="854.5" dy="28">L/N connected (L</tspan><tspan x="854.5" dy="28">fused per local rules)</tspan></text></g><g><path d="M967.5 481.5 L967.5 507.5" class="ln-thin"></path><path d="M0 0 L-12 -6 L-8.64 0 L-12 6 Z" class="ah" transform="translate(967.5 507.5) rotate(90)"></path></g><g class="rb-box"><rect x="1110" y="130" width="250" height="96" rx="10" class="box-navy"></rect><text x="1124" y="163.02" class="t-body t-white "><tspan x="1124" dy="0">Energy off or</tspan><tspan x="1124" dy="32">missing</tspan></text></g><g class="rb-box"><rect x="1110" y="252" width="250" height="101.75000000000003" rx="10" class="box-white"></rect><text x="1122" y="280.68" class="t-small t-ink"><tspan x="1122" dy="0">first latch after</tspan><tspan x="1122" dy="28">begin() is a primer —</tspan><tspan x="1122" dy="28">discard it</tspan></text></g><g><path d="M1235 226 L1235 252" class="ln-thin"></path><path d="M0 0 L-12 -6 L-8.64 0 L-12 6 Z" class="ah" transform="translate(1235 252) rotate(90)"></path></g><g class="rb-box"><rect x="1110" y="379.75" width="250" height="101.75000000000003" rx="10" class="box-white"></rect><text x="1122" y="408.43" class="t-small t-ink"><tspan x="1122" dy="0">BASIC: Wh = avg P ×</tspan><tspan x="1122" dy="28">YOUR dt; use a</tspan><tspan x="1122" dy="28">monotonic clock</tspan></text></g><g><path d="M1235 353.75 L1235 379.75" class="ln-thin"></path><path d="M0 0 L-12 -6 L-8.64 0 L-12 6 Z" class="ah" transform="translate(1235 379.75) rotate(90)"></path></g><g class="rb-box"><rect x="1110" y="507.5" width="250" height="129.75000000000003" rx="10" class="box-white"></rect><text x="1122" y="536.1800000000001" class="t-small t-ink"><tspan x="1122" dy="0">one latch per period,</tspan><tspan x="1122" dy="28">no gap; snapshot</tspan><tspan x="1122" dy="28">read before the next</tspan><tspan x="1122" dy="28">latch</tspan></text></g><g><path d="M1235 481.5 L1235 507.5" class="ln-thin"></path><path d="M0 0 L-12 -6 L-8.64 0 L-12 6 Z" class="ah" transform="translate(1235 507.5) rotate(90)"></path></g><g class="rb-box"><rect x="1110" y="663.25" width="250" height="101.75000000000003" rx="10" class="box-white"></rect><text x="1122" y="691.9300000000001" class="t-small t-ink"><tspan x="1122" dy="0">STD: read counters,</tspan><tspan x="1122" dy="28">difference between</tspan><tspan x="1122" dy="28">snapshots</tspan></text></g><g><path d="M1235 637.25 L1235 663.25" class="ln-thin"></path><path d="M0 0 L-12 -6 L-8.64 0 L-12 6 Z" class="ah" transform="translate(1235 663.25) rotate(90)"></path></g><g class="rb-box"><rect x="40" y="791" width="250" height="101.75000000000003" rx="10" class="box-data"></rect><text x="52" y="819.6800000000001" class="t-small t-navy t-bold"><tspan x="52" dy="0">two modules at 0x50</tspan><tspan x="52" dy="28">= collision: one virgin</tspan><tspan x="52" dy="28">at a time</tspan></text></g><g><path d="M165 765 L165 791" class="ln-thin dash"></path><path d="M0 0 L-12 -6 L-8.64 0 L-12 6 Z" class="ah" transform="translate(165 791) rotate(90)"></path></g><g class="rb-box"><rect x="307.5" y="791" width="250" height="101.75000000000003" rx="10" class="box-data"></rect><text x="319.5" y="819.6800000000001" class="t-small t-navy t-bold"><tspan x="319.5" dy="0">BASIC: export reads</tspan><tspan x="319.5" dy="28">0 by design (module</tspan><tspan x="319.5" dy="28">side)</tspan></text></g><g><path d="M432.5 765 L432.5 791" class="ln-thin dash"></path><path d="M0 0 L-12 -6 L-8.64 0 L-12 6 Z" class="ah" transform="translate(432.5 791) rotate(90)"></path></g><g class="rb-box"><rect x="575" y="791" width="250" height="101.75000000000003" rx="10" class="box-data"></rect><text x="587" y="819.6800000000001" class="t-small t-navy t-bold"><tspan x="587" dy="0">pick the smallest</tspan><tspan x="587" dy="28">rated clamp above</tspan><tspan x="587" dy="28">the peak (+30 %)</tspan></text></g><g><path d="M700 581.25 L700 791" class="ln-thin dash"></path><path d="M0 0 L-12 -6 L-8.64 0 L-12 6 Z" class="ah" transform="translate(700 791) rotate(90)"></path></g><g class="rb-box"><rect x="842.5" y="791" width="250" height="73.75000000000003" rx="10" class="box-data"></rect><text x="854.5" y="819.6800000000001" class="t-small t-navy t-bold"><tspan x="854.5" dy="0">reactive / apparent</tspan><tspan x="854.5" dy="28">power: STD only</tspan></text></g><g><path d="M967.5 609.25 L967.5 791" class="ln-thin dash"></path><path d="M0 0 L-12 -6 L-8.64 0 L-12 6 Z" class="ah" transform="translate(967.5 791) rotate(90)"></path></g><g class="rb-box"><rect x="1110" y="791" width="250" height="101.75000000000003" rx="10" class="box-data"></rect><text x="1122" y="819.6800000000001" class="t-small t-navy t-bold"><tspan x="1122" dy="0">export on BASIC:</tspan><tspan x="1122" dy="28">integrate negative RT</tspan><tspan x="1122" dy="28">power on the master</tspan></text></g><g><path d="M1235 765 L1235 791" class="ln-thin dash"></path><path d="M0 0 L-12 -6 L-8.64 0 L-12 6 Z" class="ah" transform="translate(1235 791) rotate(90)"></path></g><text x="700" y="935.23" class="t-small t-muted" text-anchor="middle"><tspan x="700" dy="0">still stuck → see the Troubleshooting chapter: bus checklist, error codes, DATA_VALID (0xCE)</tspan></text></svg>