<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 805" width="1400" height="805" class="rb" role="img"><style>svg.rb {  --navy: #00203F;  --mint: #ADEFD1;  --body: #1a2030;  --muted: #8a9ab0;  --box: #f8f9fa;  --border: #dee2e6;  --code: #1e1e1e;  --code-fg:#e8e8e8; --white: #ffffff;  --mains: #c2410c;  --mains-bg: #fff1e8; --neutral: #1d4ed8;  --lv: #00203F;  --data: #0f766e;  --data-bg: #e6f6f2; --warn: #b45309;  --warn-bg: #fff4d6; --ok: #15803d; --ok-bg: #e3f5e8; --bad: #b91c1c; --bad-bg: #fde8e8; --ghost: #c6ccd4;   --font-sans: Inter, "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif; --font-mono: "JetBrains Mono", "SF Mono", Consolas, Menlo, "DejaVu Sans Mono", monospace; --fs-title: 34px; --fs-sub: 22px; --fs-h: 26px;  --fs-body: 24px;  --fs-small: 21px;  --fs-mono: 22px;  --stroke: 2px;  --wire: 4px;  --wire-thin:2.5px; --radius: 10px; --radius-sm:6px; } svg.rb { font-family: var(--font-sans); font-size: var(--fs-body); fill: var(--body); } svg.rb text { fill: var(--body); font-size: var(--fs-body); white-space: pre; } svg.rb .t-title { font-size: var(--fs-title); font-weight: 600; fill: var(--navy); } svg.rb .t-sub { font-size: var(--fs-sub); fill: var(--muted); } svg.rb .t-h { font-size: var(--fs-h); font-weight: 600; fill: var(--navy); } svg.rb .t-body { font-size: var(--fs-body); fill: var(--body); } svg.rb .t-small { font-size: var(--fs-small); fill: var(--muted); } svg.rb .t-muted { fill: var(--muted); } svg.rb .t-navy { fill: var(--navy); } svg.rb .t-white { fill: var(--white); } svg.rb .t-bold { font-weight: 600; } svg.rb .t-mono { font-family: var(--font-mono); font-size: var(--fs-mono); } svg.rb .t-code { font-family: var(--font-mono); font-size: var(--fs-mono); fill: var(--code-fg); } svg.rb .t-mains { fill: var(--mains); } svg.rb .t-neutral { fill: var(--neutral); } svg.rb .t-data { fill: var(--data); } svg.rb .t-warn { fill: var(--warn); } svg.rb .t-ok { fill: var(--ok); } svg.rb .t-bad { fill: var(--bad); } svg.rb .t-center { text-anchor: middle; } svg.rb .t-right { text-anchor: end; } svg.rb .t-ink { fill: var(--body); }   svg.rb .box { fill: var(--box); stroke: var(--border); stroke-width: var(--stroke); } svg.rb .box-white { fill: var(--white); stroke: var(--border); stroke-width: var(--stroke); } svg.rb .box-navy { fill: var(--navy); stroke: var(--navy); stroke-width: var(--stroke); } svg.rb .box-code { fill: var(--code); stroke: var(--code); stroke-width: var(--stroke); } svg.rb .box-warn { fill: var(--warn-bg); stroke: var(--warn); stroke-width: var(--stroke); } svg.rb .box-ok { fill: var(--ok-bg); stroke: var(--ok); stroke-width: var(--stroke); } svg.rb .box-bad { fill: var(--bad-bg); stroke: var(--bad); stroke-width: var(--stroke); } svg.rb .box-data { fill: var(--data-bg); stroke: var(--data); stroke-width: var(--stroke); } svg.rb .box-mains { fill: var(--mains-bg); stroke: var(--mains); stroke-width: var(--stroke); } svg.rb .box-mint { fill: var(--mint); stroke: var(--mint); stroke-width: var(--stroke); } svg.rb .box-ghost { fill: none; stroke: var(--ghost); stroke-width: var(--stroke); stroke-dasharray: 8 6; } svg.rb .box-dashed { fill: none; stroke: var(--muted); stroke-width: var(--stroke); stroke-dasharray: 10 7; } svg.rb .box-outline{ fill: none; stroke: var(--navy); stroke-width: var(--stroke); }  svg.rb .ln { fill: none; stroke: var(--navy); stroke-width: var(--wire); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-thin { fill: none; stroke: var(--navy); stroke-width: var(--wire-thin); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-muted { fill: none; stroke: var(--muted); stroke-width: var(--wire-thin); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-mains { fill: none; stroke: var(--mains); stroke-width: var(--wire); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-neutral{ fill: none; stroke: var(--neutral); stroke-width: var(--wire); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-data { fill: none; stroke: var(--data); stroke-width: var(--wire-thin); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-ok { fill: none; stroke: var(--ok); stroke-width: var(--wire); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-bad { fill: none; stroke: var(--bad); stroke-width: var(--wire); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-warn { fill: none; stroke: var(--warn); stroke-width: var(--wire); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-ghost { fill: none; stroke: var(--ghost); stroke-width: var(--wire-thin); stroke-linecap: round; stroke-dasharray: 8 6; } svg.rb .dash { stroke-dasharray: 10 7; } svg.rb .dash-sm { stroke-dasharray: 4 5; }  svg.rb .ah { fill: var(--mint); stroke: var(--navy); stroke-width: 1.5px; stroke-linejoin: round; } svg.rb .ah-navy { fill: var(--navy); stroke: var(--navy); stroke-width: 1.5px; } svg.rb .ah-muted { fill: var(--muted); stroke: var(--muted); } svg.rb .ah-mains { fill: var(--mains); stroke: var(--mains); } svg.rb .ah-neutral{ fill: var(--neutral); stroke: var(--neutral); } svg.rb .ah-data { fill: var(--data); stroke: var(--data); } svg.rb .ah-ok { fill: var(--ok); stroke: var(--ok); } svg.rb .ah-bad { fill: var(--bad); stroke: var(--bad); } svg.rb .ah-warn { fill: var(--warn); stroke: var(--warn); } svg.rb .ah-ghost { fill: var(--ghost); stroke: var(--ghost); }  svg.rb .clamp { fill: var(--white); stroke: var(--navy); stroke-width: var(--wire); } svg.rb .clamp-gap { stroke: var(--white); stroke-width: 6px; } svg.rb .terminal { fill: var(--white); stroke: var(--navy); stroke-width: var(--stroke); } svg.rb .pin { fill: var(--navy); } svg.rb .pin-ghost { fill: var(--ghost); } svg.rb .dot { fill: var(--navy); } svg.rb .dot-mains { fill: var(--mains); } svg.rb .dot-neutral { fill: var(--neutral); } svg.rb .dot-white { fill: var(--white); } svg.rb .dot-mint { fill: var(--mint); } svg.rb .tri { fill: var(--warn-bg); stroke: var(--warn); stroke-width: 3px; stroke-linejoin: round; } svg.rb .tri-mark { fill: var(--warn); } svg.rb .cross { stroke: var(--bad); stroke-width: 5px; stroke-linecap: round; } svg.rb .tick { fill: none; stroke: var(--ok); stroke-width: 5px; stroke-linecap: round; stroke-linejoin: round; } svg.rb .hatch { stroke: var(--ghost); stroke-width: 2px; }</style><title>Energy accounting: BASIC vs STANDARD (STD)</title><text x="40" y="69.92" class="t-title"><tspan x="40" dy="0">Energy accounting: BASIC vs STANDARD (STD)</tspan></text><text x="590" y="126.48" class="t-small t-muted t-bold" text-anchor="middle"><tspan x="590" dy="0">rbAmp module</tspan></text><text x="1200" y="126.48" class="t-small t-muted t-bold" text-anchor="middle"><tspan x="1200" dy="0">master (your MCU)</tspan></text><g><path d="M1010 100 L1010 670" class="ln-muted dash"></path></g><g><rect x="40" y="237.15" width="91.7666064453125" height="35.699999999999996" rx="17.849999999999998" class="box-navy"></rect><text x="85.88330322265625" y="261.3" class="t-small t-white t-bold" text-anchor="middle"><tspan x="85.88330322265625" dy="0">BASIC</tspan></text></g><g><rect x="40" y="525.15" width="144.8488232421875" height="35.699999999999996" rx="17.849999999999998" class="box-navy"></rect><text x="112.42441162109375" y="549.3000000000001" class="t-small t-white t-bold" text-anchor="middle"><tspan x="112.42441162109375" dy="0">STANDARD</tspan></text></g><g><rect x="40" y="569.15" width="86.10562988281251" height="35.699999999999996" rx="17.849999999999998" class="box-navy"></rect><text x="83.05281494140625" y="593.3000000000001" class="t-small t-white t-bold" text-anchor="middle"><tspan x="83.05281494140625" dy="0">(STD)</tspan></text></g><g class="rb-box"><rect x="230" y="170" width="190" height="170" rx="10" class="box"></rect><text x="325" y="204.72" class="t-body" text-anchor="middle" transform="translate(0 9.6)"><tspan x="325" dy="0">RT power P</tspan><tspan x="325" dy="32">(signed)</tspan><tspan x="325" dy="32">every ~100</tspan><tspan x="325" dy="32">ms</tspan></text></g><g class="rb-box"><rect x="475" y="170" width="200" height="170" rx="10" class="box"></rect><text x="575" y="204.72" class="t-body" text-anchor="middle" transform="translate(0 9.6)"><tspan x="575" dy="0">period</tspan><tspan x="575" dy="32">accumulator</tspan><tspan x="575" dy="32">clamps export</tspan><tspan x="575" dy="32">to 0</tspan></text></g><g class="rb-box"><rect x="815" y="170" width="180" height="170" rx="10" class="box"></rect><text x="905" y="204.72" class="t-body" text-anchor="middle" transform="translate(0 25.6)"><tspan x="905" dy="0">avg P</tspan><tspan x="905" dy="32">(consumption</tspan><tspan x="905" dy="32">only)</tspan></text></g><g class="rb-box"><rect x="1040" y="170" width="320" height="170" rx="10" class="box-navy"></rect><text x="1200" y="204.72" class="t-body t-white" text-anchor="middle" transform="translate(0 41.6)"><tspan x="1200" dy="0">Wh += avg P × master</tspan><tspan x="1200" dy="32">dt / 3600 (master clock)</tspan></text></g><g><path d="M420 255 L475 255" class="ln"></path><path d="M0 0 L-16 -8 L-11.52 0 L-16 8 Z" class="ah" transform="translate(475 255) rotate(0)"></path></g><g><path d="M675 255 L815 255" class="ln"></path><path d="M0 0 L-16 -8 L-11.52 0 L-16 8 Z" class="ah" transform="translate(815 255) rotate(0)"></path></g><g><rect x="699.4441040039062" y="237.15" width="91.1117919921875" height="35.699999999999996" rx="17.849999999999998" class="box-mint"></rect><text x="745" y="261.3" class="t-small t-navy t-bold t-mono" text-anchor="middle"><tspan x="745" dy="0">LATCH</tspan></text></g><g><path d="M995 255 L1040 255" class="ln"></path><path d="M0 0 L-16 -8 L-11.52 0 L-16 8 Z" class="ah" transform="translate(1040 255) rotate(0)"></path></g><g class="rb-box"><rect x="1040" y="360" width="320" height="120.40000000000005" rx="10" class="box-dashed"></rect><text x="1200" y="394.72" class="t-body" text-anchor="middle"><tspan x="1200" dy="0">export: master</tspan><tspan x="1200" dy="32">integrates negative RT</tspan><