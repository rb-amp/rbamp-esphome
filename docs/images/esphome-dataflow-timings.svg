</tspan><tspan x="734" dy="24">block</tspan></text></g><g><path d="M708 372 L724 372" class="ln-thin"></path><path d="M0 0 L-11 -5.5 L-7.92 0 L-11 5.5 Z" class="ah" transform="translate(724 372) rotate(0)"></path></g><g class="rb-box"><rect x="936" y="330" width="196" height="84" rx="10" class="box-white"></rect><text x="946" y="359.62" class="t-body t-bold"><tspan x="946" dy="0">RT read</tspan></text><text x="946" y="383.94" class="t-small" style="font-size:18px"><tspan x="946" dy="0">U, I, P, PF, f</tspan></text></g><g><path d="M920 372 L936 372" class="ln-thin"></path><path d="M0 0 L-11 -5.5 L-7.92 0 L-11 5.5 Z" class="ah" transform="translate(936 372) rotate(0)"></path></g><g class="rb-box"><rect x="1148" y="330" width="196" height="84" rx="10" class="box-white"></rect><text x="1158" y="359.62" class="t-body t-bold"><tspan x="1158" dy="0">publish</tspan></text><text x="1158" y="383.94" class="t-small t-mono" style="font-size:18px"><tspan x="1158" dy="0">publish_state()</tspan></text></g><g><path d="M1132 372 L1148 372" class="ln-thin"></path><path d="M0 0 L-11 -5.5 L-7.92 0 L-11 5.5 Z" class="ah" transform="translate(1148 372) rotate(0)"></path></g><g><path d="M330 290 L330 210" class="ln-data dash"></path><path d="M0 0 L-13 -6.5 L-9.36 0 L-13 6.5 Z" class="ah-data" transform="translate(330 210) rotate(-90)"></path><rect x="340" y="233.35" width="135.56982421875" height="33.3" rx="5" fill="var(--white)" opacity="0.9"></rect><text x="407.784912109375" y="254.82999999999998" class="t-small t-navy" text-anchor="middle"><tspan x="407.784912109375" dy="0">any window</tspan></text></g><g class="rb-box"><rect x="300" y="460" width="500" height="56" rx="10" class="box-data"></rect><text x="550" y="492.08000000000004" class="t-small t-data" text-anchor="middle" transform="translate(0 2.3)"><tspan x="550" dy="0">energy total saved to NVS every 5 min</tspan></text></g><g class="rb-box"><rect x="820" y="460" width="480" height="56" rx="10" class="box-warn"></rect><text x="1