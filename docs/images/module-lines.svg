<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 650" width="1400" height="650" class="rb" role="img"><style>svg.rb {  --navy: #00203F;  --mint: #ADEFD1;  --body: #1a2030;  --muted: #8a9ab0;  --box: #f8f9fa;  --border: #dee2e6;  --code: #1e1e1e;  --code-fg:#e8e8e8; --white: #ffffff;  --mains: #c2410c;  --mains-bg: #fff1e8; --neutral: #1d4ed8;  --lv: #00203F;  --data: #0f766e;  --data-bg: #e6f6f2; --warn: #b45309;  --warn-bg: #fff4d6; --ok: #15803d; --ok-bg: #e3f5e8; --bad: #b91c1c; --bad-bg: #fde8e8; --ghost: #c6ccd4;   --font-sans: Inter, "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif; --font-mono: "JetBrains Mono", "SF Mono", Consolas, Menlo, "DejaVu Sans Mono", monospace; --fs-title: 34px; --fs-sub: 22px; --fs-h: 26px;  --fs-body: 24px;  --fs-small: 21px;  --fs-mono: 22px;  --stroke: 2px;  --wire: 4px;  --wire-thin:2.5px; --radius: 10px; --radius-sm:6px; } svg.rb { font-family: var(--font-sans); font-size: var(--fs-body); fill: var(--body); } svg.rb text { fill: var(--body); font-size: var(--fs-body); white-space: pre; } svg.rb .t-title { font-size: var(--fs-title); font-weight: 600; fill: var(--navy); } svg.rb .t-sub { font-size: var(--fs-sub); fill: var(--muted); } svg.rb .t-h { font-size: var(--fs-h); font-weight: 600; fill: var(--navy); } svg.rb .t-body { font-size: var(--fs-body); fill: var(--body); } svg.rb .t-small { font-size: var(--fs-small); fill: var(--muted); } svg.rb .t-muted { fill: var(--muted); } svg.rb .t-navy { fill: var(--navy); } svg.rb .t-white { fill: var(--white); } svg.rb .t-bold { font-weight: 600; } svg.rb .t-mono { font-family: var(--font-mono); font-size: var(--fs-mono); } svg.rb .t-code { font-family: var(--font-mono); font-size: var(--fs-mono); fill: var(--code-fg); } svg.rb .t-mains { fill: var(--mains); } svg.rb .t-neutral { fill: var(--neutral); } svg.rb .t-data { fill: var(--data); } svg.rb .t-warn { fill: var(--warn); } svg.rb .t-ok { fill: var(--ok); } svg.rb .t-bad { fill: var(--bad); } svg.rb .t-center { text-anchor: middle; } svg.rb .t-right { text-anchor: end; } svg.rb .t-ink { fill: var(--body); }   svg.rb .box { fill: var(--box); stroke: var(--border); stroke-width: var(--stroke); } svg.rb .box-white { fill: var(--white); stroke: var(--border); stroke-width: var(--stroke); } svg.rb .box-navy { fill: var(--navy); stroke: var(--navy); stroke-width: var(--stroke); } svg.rb .box-code { fill: var(--code); stroke: var(--code); stroke-width: var(--stroke); } svg.rb .box-warn { fill: var(--warn-bg); stroke: var(--warn); stroke-width: var(--stroke); } svg.rb .box-ok { fill: var(--ok-bg); stroke: var(--ok); stroke-width: var(--stroke); } svg.rb .box-bad { fill: var(--bad-bg); stroke: var(--bad); stroke-width: var(--stroke); } svg.rb .box-data { fill: var(--data-bg); stroke: var(--data); stroke-width: var(--stroke); } svg.rb .box-mains { fill: var(--mains-bg); stroke: var(--mains); stroke-width: var(--stroke); } svg.rb .box-mint { fill: var(--mint); stroke: var(--mint); stroke-width: var(--stroke); } svg.rb .box-ghost { fill: none; stroke: var(--ghost); stroke-width: var(--stroke); stroke-dasharray: 8 6; } svg.rb .box-dashed { fill: none; stroke: var(--muted); stroke-width: var(--stroke); stroke-dasharray: 10 7; } svg.rb .box-outline{ fill: none; stroke: var(--navy); stroke-width: var(--stroke); }  svg.rb .ln { fill: none; stroke: var(--navy); stroke-width: var(--wire); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-thin { fill: none; stroke: var(--navy); stroke-width: var(--wire-thin); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-muted { fill: none; stroke: var(--muted); stroke-width: var(--wire-thin); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-mains { fill: none; stroke: var(--mains); stroke-width: var(--wire); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-neutral{ fill: none; stroke: var(--neutral); stroke-width: var(--wire); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-data { fill: none; stroke: var(--data); stroke-width: var(--wire-thin); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-ok { fill: none; stroke: var(--ok); stroke-width: var(--wire); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-bad { fill: none; stroke: var(--bad); stroke-width: var(--wire); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-warn { fill: none; stroke: var(--warn); stroke-width: var(--wire); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-ghost { fill: none; stroke: var(--ghost); stroke-width: var(--wire-thin); stroke-linecap: round; stroke-dasharray: 8 6; } svg.rb .dash { stroke-dasharray: 10 7; } svg.rb .dash-sm { stroke-dasharray: 4 5; }  svg.rb .ah { fill: var(--mint); stroke: var(--navy); stroke-width: 1.5px; stroke-linejoin: round; } svg.rb .ah-navy { fill: var(--navy); stroke: var(--navy); stroke-width: 1.5px; } svg.rb .ah-muted { fill: var(--muted); stroke: var(--muted); } svg.rb .ah-mains { fill: var(--mains); stroke: var(--mains); } svg.rb .ah-neutral{ fill: var(--neutral); stroke: var(--neutral); } svg.rb .ah-data { fill: var(--data); stroke: var(--data); } svg.rb .ah-ok { fill: var(--ok); stroke: var(--ok); } svg.rb .ah-bad { fill: var(--bad); stroke: var(--bad); } svg.rb .ah-warn { fill: var(--warn); stroke: var(--warn); } svg.rb .ah-ghost { fill: var(--ghost); stroke: var(--ghost); }  svg.rb .clamp { fill: var(--white); stroke: var(--navy); stroke-width: var(--wire); } svg.rb .clamp-gap { stroke: var(--white); stroke-width: 6px; } svg.rb .terminal { fill: var(--white); stroke: var(--navy); stroke-width: var(--stroke); } svg.rb .pin { fill: var(--navy); } svg.rb .pin-ghost { fill: var(--ghost); } svg.rb .dot { fill: var(--navy); } svg.rb .dot-mains { fill: var(--mains); } svg.rb .dot-neutral { fill: var(--neutral); } svg.rb .dot-white { fill: var(--white); } svg.rb .dot-mint { fill: var(--mint); } svg.rb .tri { fill: var(--warn-bg); stroke: var(--warn); stroke-width: 3px; stroke-linejoin: round; } svg.rb .tri-mark { fill: var(--warn); } svg.rb .cross { stroke: var(--bad); stroke-width: 5px; stroke-linecap: round; } svg.rb .tick { fill: none; stroke: var(--ok); stroke-width: 5px; stroke-linecap: round; stroke-linejoin: round; } svg.rb .hatch { stroke: var(--ghost); stroke-width: 2px; }</style><title>Module lines: BASIC and STANDARD (STD)</title><text x="40" y="69.92" class="t-title"><tspan x="40" dy="0">Module lines: BASIC and STANDARD (STD)</tspan></text><g class="rb-box"><rect x="40" y="120" width="1320" height="92" rx="10" class="box-white"></rect><text x="700" y="156.42000000000002" class="t-body t-navy" text-anchor="middle"><tspan x="700" dy="0">Both lines: voltage, current, active power, power factor, mains frequency — a new window every ~100 ms,</tspan><tspan x="700" dy="32">read over I²C; CT clamp on L, voltage reference tap L/N</tspan></text></g><g><path d="M360 212 L360 252" class="ln"></path><path d="M0 0 L-16 -8 L-11.52 0 L-16 8 Z" class="ah" transform="translate(360 252) rotate(90)"></path></g><g class="rb-box"><rect x="40" y="252" width="640" height="84.84999999999998" rx="10" class="box-navy"></rect><text x="56" y="288.48" class="t-h t-white "><tspan x="56" dy="0">BASIC</tspan></text><text x="56" y="315.98" class="t-small t-white"><tspan x="56" dy="0">ships today, clamp you supply</tspan></text></g><g><rect x="402.4391552734375" y="276.15" width="255.12168945312501" height="35.699999999999996" rx="17.849999999999998" class="box-mint"></rect><text x="530" y="300.3" class="t-small t-navy t-bold" text-anchor="middle"><tspan x="530" dy="0">energy: on the master</tspan></text></g><g class="rb-box"><rect x="40" y="348.84999999999997" width="640" height="260.40000000000003" rx="10" class="box"></rect><circle cx="66" cy="380.72999999999996" r="3.5" class="dot "></circle><text x="80" y="386.96999999999997" class="t-body"><tspan x="80" dy="0">RT power P stays signed</tspan></text><circle cx="66" cy="414.33" r="3.5" class="dot "></circle><text x="80" y="420.57" class="t-body"><tspan x="80" dy="0">period accumulator: consumption only (export</tspan><tspan x="80" dy="32">clamped to 0)</tspan></text><circle cx="66" cy="479.92999999999995" r="3.5" class="dot "></circle><text x="80" y="486.16999999999996" class="t-body"><tspan x="80" dy="0">energy (Wh) integrated by the master on its own</tspan><tspan x="80" dy="32">clock</tspan></text><circle cx="66" cy="545.53" r="3.5" class="dot "></circle><text x="80" y="551.77" class="t-body"><tspan x="80" dy="0">export: master integrates negative RT power</tspan><tspan x="80" dy="32">itself</tspan></text></g><g><path d="M1040 212 L1040 252" class="ln"></path><path d="M0 0 L-16 -8 L-11.52 0 L-16 8 Z" class="ah" transform="translate(1040 252) rotate(90)"></path></g><g class="rb-box"><rect x="720" y="252" width="640" height="84.84999999999998" rx="10" class="box-navy"></rect><text x="736" y="288.48" class="t-h t-white "><tspan x="736" dy="0">STANDARD (STD)</tspan></text><text x="736" y="315.98" class="t-small t-white"><tspan x="736" dy="0">extended line</tspan></text></g><g><rect x="1079.8093359375" y="276.15" width="260.381328125" height="35.699999999999996" rx="17.849999999999998" class="box-mint"></rect><text x="1210" y="300.3" class="t-small t-navy t-bold" text-anchor="middle"><tspan x="1210" dy="0">energy: on the module</tspan></text></g><g class="rb-box"><rect x="720" y="348.84999999999997" width="640" height="196.40000000000003" rx="10" class="box"></rect><circle cx="746" cy="380.72999999999996" r="3.5" class="dot "></circle><text x="760" y="386.96999999999997" class="t-body"><tspan x="760" dy="0">on-device cumulative energy counters — survive</tspan><tspan x="760" dy="32">restart</tspan></text><circle cx="746" cy="446.3299999999999" r="3.5" class="dot "></circle><text x="760" y="452.56999999999994" class="t-body"><tspan x="760" dy="0">import / export / net</tspan></text><circle cx="746" cy="479.92999999999995" r="3.5" class="dot "></circle><text x="760" y="486.16999999999996" class="t-body"><tspan x="760" dy="0">reactive + apparent power</tspan></text><circle cx="746" cy="513.53" r="3.5" class="dot "></circle><text x="760" y="519.77" class="t-body"><tspan x="760" dy="0">extra STD calls, some need a newer image</tspan></text></g></svg>