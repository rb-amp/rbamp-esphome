 { fill: none; stroke: var(--data); stroke-width: var(--wire-thin); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-ok { fill: none; stroke: var(--ok); stroke-width: var(--wire); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-bad { fill: none; stroke: var(--bad); stroke-width: var(--wire); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-warn { fill: none; stroke: var(--warn); stroke-width: var(--wire); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-ghost { fill: none; stroke: var(--ghost); stroke-width: var(--wire-thin); stroke-linecap: round; stroke-dasharray: 8 6; } svg.rb .dash { stroke-dasharray: 10 7; } svg.rb .dash-sm { stroke-dasharray: 4 5; }  svg.rb .ah { fill: var(--mint); stroke: var(--navy); stroke-width: 1.5px; stroke-linejoin: round; } svg.rb .ah-navy { fill: var(--navy); stroke: var(--navy); stroke-width: 1.5px; } svg.rb .ah-muted { fill: var(--muted); stroke: var(--muted); } svg.rb .ah-mains { fill: var(--mains); stroke: var(--mains); } svg.rb .ah-neutral{ fill: var(--neutral); stroke: var(--neutral); } svg.rb .ah-data { fill: var(--data); stroke: var(--data); } svg.rb .ah-ok { fill: var(--ok); stroke: var(--ok); } svg.rb .ah-bad { fill: var(--bad); stroke: var(--bad); } svg.rb .ah-warn { fill: var(--warn); stroke: var(--warn); } svg.rb .ah-ghost { fill: var(--ghost); stroke: var(--ghost); }  svg.rb .clamp { fill: var(--white); stroke: var(--navy); stroke-width: var(--wire); } svg.rb .clamp-gap { stroke: var(--white); stroke-width: 6px; } svg.rb .terminal { fill: var(--white); stroke: var(--navy); stroke-width: var(--stroke); } svg.rb .pin { fill: var(--navy); } svg.rb .pin-ghost { fill: var(--ghost); } svg.rb .dot { fill: var(--navy); } svg.rb .dot-mains { fill: var(--mains); } svg.rb .dot-neutral { fill: var(--neutral); } svg.rb .dot-white { fill: var(--white); } svg.rb .dot-mint { fill: var(--mint); } svg.rb .tri { fill: var(--warn-bg); stroke: var(--warn); stroke-width: 3px; stroke-linejoin: round; } svg.rb .tri-mark { fill: var(--warn); } svg.rb .cross { stroke: var(--bad); stroke-width: 5px; stroke-linecap: round; } svg.rb .tick { fill: none; stroke: var(--ok); stroke-width: 5px; stroke-linecap: round; stroke-linejoin: round; } svg.rb .hatch { stroke: var(--ghost); stroke-width: 2px; }</style><title>Provisioning addresses: one virgin module at a time</title><text x="40" y="69.92" class="t-title"><tspan x="40" dy="0">Provisioning addresses: one virgin module at a time</tspan></text><defs><pattern id="hatch" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="16" class="hatch"></line></pattern></defs><g class="rb-box"><rect x="40" y="150" width="150" height="70" rx="10" class="box-navy"></rect><text x="115" y="184.72" class="t-body t-white " text-anchor="middle" transform="translate(0 7.6)"><tspan x="115" dy="0">master</tspan></text></g><g><path d="M190 185 L600 185" class="ln-data"></path></g><g><rect x="509.09469238281247" y="137.15" width="101.810615234375" height="35.699999999999996" rx="17.849999999999998" class="box-mint"></rect><text x="560" y="161.29999999999998" class="t-small t-navy t-bold" text-anchor="middle"><tspan x="560" dy="0">I²C bus</tspan></text></g><g><path d="M250 185 L250 250" class="ln-ghost"></path></g><g><path d="M241 263 L259 281 M259 263 L241 281" class="cross"></path></g><g class="rb-box"><rect x="205" y="290" width="90" height="80" rx="10" class="box-ghost"></rect><text x="250" y="317.92" class="t-body t-muted t-mono" text-anchor="middle" transform="translate(0 19.4)"><tspan x="250" dy="0">0x51</tspan></text></g><rect x="205" y="290" width="90" height="80" rx="10" fill="url(#hatch)"></rect><g><path d="M350 185 L350 250" class="ln-ghost"></path></g><g><path d="M341 263 L359 281 M359 263 L341 281" class="cross"></path></g><g class="rb-box"><rect x="305" y="290" width="90" height="80" rx="10" class="box-ghost"></rect><text x="350" y="317.92" class="t-body t-muted t-mono" 