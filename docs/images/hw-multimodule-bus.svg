></circle><g><path d="M820 280 L820 420" class="ln-data"></path></g><circle cx="820" cy="280" r="5" class="pin"></circle><g><path d="M780 420 L780 450" class="ln-ghost"></path></g><g><path d="M820 420 L820 450" class="ln-ghost"></path></g><g><rect x="725" y="463" width="20" height="18" rx="3" fill="var(--jumper-pad, #d9a21b)" stroke="var(--navy)" stroke-width="1.5"></rect><rect x="765" y="463" width="20" height="18" rx="3" fill="var(--jumper-pad, #d9a21b)" stroke="var(--navy)" stroke-width="1.5"></rect><line x1="745" y1="472" x2="748" y2="472" stroke="var(--jumper-pad, #d9a21b)" stroke-width="6"></line><line x1="762" y1="472" x2="765" y2="472" stroke="var(--jumper-pad, #d9a21b)" stroke-width="6"></line><path d="M751 459 L759 485" class="cross"></path></g><g><rect x="815" y="463" width="20" height="18" rx="3" fill="var(--jumper-pad, #d9a21b)" stroke="var(--navy)" stroke-width="1.5"></rect><rect x="855" y="463" width="20" height="18" rx="3" fill="var(--jumper-pad, #d9a21b)" stroke="var(--navy)" stroke-width="1.5"></rect><line x1="835" y1="472" x2="838" y2="472" stroke="var(--jumper-pad, #d9a21b)" stroke-width="6"></line><line x1="852" y1="472" x2="855" y2="472" stroke="var(--jumper-pad, #d9a21b)" stroke-width="6"></line><path d="M841 459 L849 485" class="cross"></path></g><text x="800" y="505.2" class="t-small t-muted t-mono" text-anchor="middle" style="font-size:15px"><tspan x="800" dy="0">I2C pull-up</tspan></text><g class="rb-box"><rect x="970" y="420" width="220" height="150" rx="10" class="box-white"></rect></g><text x="1080" y="547.12" class="t-body t-navy t-bold t-mono" text-anchor="middle"><tspan x="1080" dy="0">rbAmp @ 0x52</tspan></text><g><path d="M1060 240 L1060 420" class="ln-data"></path></g><circle cx="1060" cy="240" r="5" class="pin"></circle><g><path d="M1100 280 L1100 420" class="ln-data"></path></g><circle cx="1100" cy="280" r="5" class="pin"></circle><g><path d="M1060 420 L1060 450" class="ln-ghost"></path></g><g><path d="M1100 420 L1100 450" class="ln-ghost"></path></g><g><rect x="1005" y="463" width="20" height="18" rx="3" fill="var(--jumper-pad, #d9a21b)" stroke="var(--navy)" stroke-width="1.5"></rect><rect x="1045" y="463" width="20" height="18" rx="3" fill="var(--jumper-pad, #d9a21b)" stroke="var(--navy)" stroke-width="1.5"></rect><line x1="1025" y1="472" x2="1028" y2="472" stroke="var(--jumper-pad, #d9a21b)" stroke-width="6"></line><line x1="1042" y1="472" x2="1045" y2="472" stroke="var(--jumper-pad, #d9a21b)" stroke-width="6"></line><path d="M1031 459 L1039 485" class="cross"></path></g><g><rect x="1095" y="463" width="20" height="18" rx="3" fill="var(--jumper-pad, #d9a21b)" stroke="var(--navy)" stroke-width="1.5"></rect><rect x="1135" y="463" width="20" height="18" rx="3" fill="var(--jumper-pad, #d9a21b)" stroke="var(--navy)" stroke-width="1.5"></rect><line x1="1115" y1="472" x2="1118" y2="472" stroke="var(--jumper-pad, #d9a21b)" stroke-width="6"></line><line x1="1132" y1="472" x2="1135" y2="472" stroke="var(--jumper-pad, #d9a21b)" stroke-width="6"></line><path d="M1121 459 L1129 485" class="cross"></path></g><text x="1080" y="505.2" class="t-small t-muted t-mono" text-anchor="middle" style="font-size:15px"><tspan x="1080" dy="0">I2C pull-up</tspan></text><text x="800" y="604.48" class="t-small t-bad t-bold" text-anchor="middle"><tspan x="800" dy="0">built-in pull-ups cut (3+ modules)</tspan></text><g class="rb-box"><rect x="40" y="626" width="1320" height="45.75000000000002" rx="10" class="box-white"></rect><text x="700" y="654.6800000000001" class="t-small t-navy t-bold" text-anchor="middle"><tspan x="700" dy="0">Rule: 1 module — keep built-in · 2 modules — keep on ONE, cut the other · 3+ — cut all, one external pair at the master</tspan></text></g><text x="40" y="734.88" class="t-h"><tspan x="40" dy="0">DRDY options</tspan></text><g class="rb-box"><rect x="40" y="756" width="428" height="75.35000000000005" rx="10" class="box"></rect><text x="52" y="787.32" class="t-body t-bold"><tspan x="52" dy="0">none</tspan></text><text x="52" y="814.2800000000001" class="t-small t-ink"><tspan x="52" dy="0">poll on a timer, SDA/SCL only</tspan></text></g><g class="rb-box"><rect x="486" y="756" width="428" height="103.35000000000005" rx="10" class="box"></rect><text x="498" y="787.32" class="t-body t-bold"><tspan x="498" dy="0">one line per module</tspan></text><text x="498" y="814.2800000000001" class="t-small t-ink"><tspan x="498" dy="0">one GPIO each, read right after the</tspan><tspan x="498" dy="28">pulse</tspan></text></g><g class="rb-box"><rect x="932" y="756" width="428" height="103.35000000000005" rx="10" class="box"></rect><text x="944" y="787.32" class="t-body t-bold"><tspan x="944" dy="0">shared (wired-OR)</tspan></text><text x="944" y="814.2800000000001" class="t-small t-ink"><tspan x="944" dy="0">open-drain lines tied together, one</tspan><tspan x="944" dy="28">pull-up; any pulse → read all</tspan></text></g><text x="40" y="900.48" class="t-small t-muted"><tspan x="40" dy="0">50 kHz ESP32 / ESP8266 · 100 kHz UNO, Mega, STM32, RP2040, Raspberry Pi · never 400 kHz</tspan></text></svg>