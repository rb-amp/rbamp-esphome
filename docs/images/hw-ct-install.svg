<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 587" width="1400" height="587" class="rb" role="img"><style>svg.rb {  --navy: #00203F;  --mint: #ADEFD1;  --body: #1a2030;  --muted: #8a9ab0;  --box: #f8f9fa;  --border: #dee2e6;  --code: #1e1e1e;  --code-fg:#e8e8e8; --white: #ffffff;  --mains: #c2410c;  --mains-bg: #fff1e8; --neutral: #1d4ed8;  --lv: #00203F;  --data: #0f766e;  --data-bg: #e6f6f2; --warn: #b45309;  --warn-bg: #fff4d6; --ok: #15803d; --ok-bg: #e3f5e8; --bad: #b91c1c; --bad-bg: #fde8e8; --ghost: #c6ccd4;   --font-sans: Inter, "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif; --font-mono: "JetBrains Mono", "SF Mono", Consolas, Menlo, "DejaVu Sans Mono", monospace; --fs-title: 34px; --fs-sub: 22px; --fs-h: 26px;  --fs-body: 24px;  --fs-small: 21px;  --fs-mono: 22px;  --stroke: 2px;  --wire: 4px;  --wire-thin:2.5px; --radius: 10px; --radius-sm:6px; } svg.rb { font-family: var(--font-sans); font-size: var(--fs-body); fill: var(--body); } svg.rb text { fill: var(--body); font-size: var(--fs-body); white-space: pre; } svg.rb .t-title { font-size: var(--fs-title); font-weight: 600; fill: var(--navy); } svg.rb .t-sub { font-size: var(--fs-sub); fill: var(--muted); } svg.rb .t-h { font-size: var(--fs-h); font-weight: 600; fill: var(--navy); } svg.rb .t-body { font-size: var(--fs-body); fill: var(--body); } svg.rb .t-small { font-size: var(--fs-small); fill: var(--muted); } svg.rb .t-muted { fill: var(--muted); } svg.rb .t-navy { fill: var(--navy); } svg.rb .t-white { fill: var(--white); } svg.rb .t-bold { font-weight: 600; } svg.rb .t-mono { font-family: var(--font-mono); font-size: var(--fs-mono); } svg.rb .t-code { font-family: var(--font-mono); font-size: var(--fs-mono); fill: var(--code-fg); } svg.rb .t-mains { fill: var(--mains); } svg.rb .t-neutral { fill: var(--neutral); } svg.rb .t-data { fill: var(--data); } svg.rb .t-warn { fill: var(--warn); } svg.rb .t-ok { fill: var(--ok); } svg.rb .t-bad { fill: var(--bad); } svg.rb .t-center { text-anchor: middle; } svg.rb .t-right { text-anchor: end; } svg.rb .t-ink { fill: var(--body); }   svg.rb .box { fill: var(--box); stroke: var(--border); stroke-width: var(--stroke); } svg.rb .box-white { fill: var(--white); stroke: var(--border); stroke-width: var(--stroke); } svg.rb .box-navy { fill: var(--navy); stroke: var(--navy); stroke-width: var(--stroke); } svg.rb .box-code { fill: var(--code); stroke: var(--code); stroke-width: var(--stroke); } svg.rb .box-warn { fill: var(--warn-bg); stroke: var(--warn); stroke-width: var(--stroke); } svg.rb .box-ok { fill: var(--ok-bg); stroke: var(--ok); stroke-width: var(--stroke); } svg.rb .box-bad { fill: var(--bad-bg); stroke: var(--bad); stroke-width: var(--stroke); } svg.rb .box-data { fill: var(--data-bg); stroke: var(--data); stroke-width: var(--stroke); } svg.rb .box-mains { fill: var(--mains-bg); stroke: var(--mains); stroke-width: var(--stroke); } svg.rb .box-mint { fill: var(--mint); stroke: var(--mint); stroke-width: var(--stroke); } svg.rb .box-ghost { fill: none; stroke: var(--ghost); stroke-width: var(--stroke); stroke-dasharray: 8 6; } svg.rb .box-dashed { fill: none; stroke: var(--muted); stroke-width: var(--stroke); stroke-dasharray: 10 7; } svg.rb .box-outline{ fill: none; stroke: var(--navy); stroke-width: var(--stroke); }  svg.rb .ln { fill: none; stroke: var(--navy); stroke-width: var(--wire); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-thin { fill: none; stroke: var(--navy); stroke-width: var(--wire-thin); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-muted { fill: none; stroke: var(--muted); stroke-width: var(--wire-thin); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-mains { fill: none; stroke: var(--mains); stroke-width: var(--wire); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-neutral{ fill: none; stroke: var(--neutral); stroke-width: var(--wire); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-data { fill: none; stroke: var(--data); stroke-width: var(--wire-thin); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-ok { fill: none; stroke: var(--ok); stroke-width: var(--wire); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-bad { fill: none; stroke: var(--bad); stroke-width: var(--wire); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-warn { fill: none; stroke: var(--warn); stroke-width: var(--wire); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-ghost { fill: none; stroke: var(--ghost); stroke-width: var(--wire-thin); stroke-linecap: round; stroke-dasharray: 8 6; } svg.rb .dash { stroke-dasharray: 10 7; } svg.rb .dash-sm { stroke-dasharray: 4 5; }  svg.rb .ah { fill: var(--mint); stroke: var(--navy); stroke-width: 1.5px; stroke-linejoin: round; } svg.rb .ah-navy { fill: var(--navy); stroke: var(--navy); stroke-width: 1.5px; } svg.rb .ah-muted { fill: var(--muted); stroke: var(--muted); } svg.rb .ah-mains { fill: var(--mains); stroke: var(--mains); } svg.rb .ah-neutral{ fill: var(--neutral); stroke: var(--neutral); } svg.rb .ah-data { fill: var(--data); stroke: var(--data); } svg.rb .ah-ok { fill: var(--ok); stroke: var(--ok); } svg.rb .ah-bad { fill: var(--bad); stroke: var(--bad); } svg.rb .ah-warn { fill: var(--warn); stroke: var(--warn); } svg.rb .ah-ghost { fill: var(--ghost); stroke: var(--ghost); }  svg.rb .clamp { fill: var(--white); stroke: var(--navy); stroke-width: var(--wire); } svg.rb .clamp-gap { stroke: var(--white); stroke-width: 6px; } svg.rb .terminal { fill: var(--white); stroke: var(--navy); stroke-width: var(--stroke); } svg.rb .pin { fill: var(--navy); } svg.rb .pin-ghost { fill: var(--ghost); } svg.rb .dot { fill: var(--navy); } svg.rb .dot-mains { fill: var(--mains); } svg.rb .dot-neutral { fill: var(--neutral); } svg.rb .dot-white { fill: var(--white); } svg.rb .dot-mint { fill: var(--mint); } svg.rb .tri { fill: var(--warn-bg); stroke: var(--warn); stroke-width: 3px; stroke-linejoin: round; } svg.rb .tri-mark { fill: var(--warn); } svg.rb .cross { stroke: var(--bad); stroke-width: 5px; stroke-linecap: round; } svg.rb .tick { fill: none; stroke: var(--ok); stroke-width: 5px; stroke-linecap: round; stroke-linejoin: round; } svg.rb .hatch { stroke: var(--ghost); stroke-width: 2px; }</style><title>CT clamp: one conductor only</title><text x="40" y="69.92" class="t-title"><tspan x="40" dy="0">CT clamp: one conductor only</tspan></text><g class="rb-box"><rect x="40" y="130" width="640" height="330" rx="10" class="box-ok"></rect></g><text x="60" y="168.88" class="t-h t-ok"><tspan x="60" dy="0">Correct</tspan></text><text x="60" y="200.38" class="t-small t-ink"><tspan x="60" dy="0">clamp around L only, arrow toward the load, N</tspan><tspan x="60" dy="28">outside</tspan></text><path d="M622 166 L631.8 175.8 L650 156.2" class="tick"></path><g class="rb-box"><rect x="60" y="280" width="90" height="120" rx="10" class="box-white"></rect><text x="105" y="312.08000000000004" class="t-small" text-anchor="middle" transform="translate(0 34.3)"><tspan x="105" dy="0">supply</tspan></text></g><g class="rb-box"><rect x="570" y="280" width="90" height="120" rx="10" class="box-white"></rect><text x="615" y="312.08000000000004" class="t-small" text-anchor="middle" transform="translate(0 34.3)"><tspan x="615" dy="0">load</tspan></text></g><g><path d="M150 320 L570 320" class="ln-mains"></path></g><g><path d="M150 380 L570 380" class="ln-neutral"></path></g><text x="160" y="304.48" class="t-small t-mains t-bold t-mono"><tspan x="160" dy="0">L</tspan></text><text x="160" y="406.48" class="t-small t-neutral t-bold t-mono"><tspan x="160" dy="0">N</tspan></text><g class="rb-clamp"><circle cx="360" cy="320" r="34" class="clamp" fill="none"></circle><circle cx="360" cy="320" r="21.08" class="clamp" fill="none"></circle><circle cx="340.5262792461225" cy="300.5262792461225" r="5.78" class="clamp" fill="var(--white)"></circle><line x1="373.2228968081884" y1="306.7771031918116" x2="385.7245446995666" y2="294.2754553004334" class="clamp-gap"></line></g><g><path d="M420 260 L530 260" class="ln-ok"></path><path d="M0 0 L-13 -6.5 L-9.36 0 L-13 6.5 Z" class="ah-ok" transform="translate(530 260) rotate(0)"></path></g><text x="475" y="242.48" class="t-small t-ok t-bold" text-anchor="middle"><tspan x="475" dy="0">arrow toward the load</tspan></text><text x="360" y="428.48" class="t-small t-neutral" text-anchor="middle"><tspan x="360" dy="0">N outside the clamp</tspan></text><g class="rb-box"><rect x="720" y="130" width="640" height="330" rx="10" class="box-bad"></rect></g><text x="740" y="168.88" class="t-h t-bad"><tspan x="740" dy="0">Wrong</tspan></text><text x="740" y="200.38" class="t-small t-ink"><tspan x="740" dy="0">L and N both through the clamp — the two currents</tspan><tspan x="740" dy="28">cancel, the module reads ≈ 0</tspan></text><g><path d="M1304 154 L1328 178 M1328 154 L1304 178" class="cross"></path></g><g class="rb-box"><rect x="740" y="280" width="90" height="120" rx="10" class="box-white"></rect><text x="785" y="312.08000000000004" class="t-small" text-anchor="middle" transform="translate(0 34.3)"><tspan x="785" dy="0">supply</tspan></text></g><g class="rb-box"><rect x="1250" y="280" width="90" height="120" rx="10" class="box-white"></rect><text x="1295" y="312.08000000000004" class="t-small" text-anchor="middle" transform="translate(0 34.3)"><tspan x="1295" dy="0">load</tspan></text></g><g><path d="M830 320 L1250 320" class="ln-mains"></path></g><g><path d="M830 380 L1250 380" class="ln-neutral"></path></g><text x="840" y="304.48" class="t-small t-mains t-bold t-mono"><tspan x="840" dy="0">L</tspan></text><text x="840" y="406.48" class="t-small t-neutral t-bold t-mono"><tspan x="840" dy="0">N</tspan></text><g class="rb-clamp"><circle cx="1040" cy="350" r="58" class="clamp" fill="none"></circle><circle cx="1040" cy="350" r="35.96" class="clamp" fill="none"></circle><circle cx="1006.780123419856" cy="316.780123419856" r="9.860000000000001" class="clamp" fill="var(--white)"></circle><line x1="1062.556706319851" y1="327.44329368014917" x2="1083.8830468404371" y2="306.11695315956285" class="clamp-gap"></line></g><text x="1040" y="438.48" class="t-small t-bad t-bold" text-anchor="middle"><tspan x="1040" dy="0">fluxes cancel → I ≈ 0</tspan></text><g class="rb-box"><rect x="40" y="490" width="1320" height="56.40000000000005" rx="10" class="box-white"></rect><text x="700" y="524.72" class="t-body t-navy t-bold" text-anchor="middle"><tspan x="700" dy="0">Clamp closed completely, jack fully inserted. Clamp on L only — never on the cable with both conductors.</tspan></text></g></svg>