<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 627" width="1400" height="627" class="rb" role="img"><style>svg.rb {  --navy: #00203F;  --mint: #ADEFD1;  --body: #1a2030;  --muted: #8a9ab0;  --box: #f8f9fa;  --border: #dee2e6;  --code: #1e1e1e;  --code-fg:#e8e8e8; --white: #ffffff;  --mains: #c2410c;  --mains-bg: #fff1e8; --neutral: #1d4ed8;  --lv: #00203F;  --data: #0f766e;  --data-bg: #e6f6f2; --warn: #b45309;  --warn-bg: #fff4d6; --ok: #15803d; --ok-bg: #e3f5e8; --bad: #b91c1c; --bad-bg: #fde8e8; --ghost: #c6ccd4;   --font-sans: Inter, "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif; --font-mono: "JetBrains Mono", "SF Mono", Consolas, Menlo, "DejaVu Sans Mono", monospace; --fs-title: 34px; --fs-sub: 22px; --fs-h: 26px;  --fs-body: 24px;  --fs-small: 21px;  --fs-mono: 22px;  --stroke: 2px;  --wire: 4px;  --wire-thin:2.5px; --radius: 10px; --radius-sm:6px; } svg.rb { font-family: var(--font-sans); font-size: var(--fs-body); fill: var(--body); } svg.rb text { fill: var(--body); font-size: var(--fs-body); white-space: pre; } svg.rb .t-title { font-size: var(--fs-title); font-weight: 600; fill: var(--navy); } svg.rb .t-sub { font-size: var(--fs-sub); fill: var(--muted); } svg.rb .t-h { font-size: var(--fs-h); font-weight: 600; fill: var(--navy); } svg.rb .t-body { font-size: var(--fs-body); fill: var(--body); } svg.rb .t-small { font-size: var(--fs-small); fill: var(--muted); } svg.rb .t-muted { fill: var(--muted); } svg.rb .t-navy { fill: var(--navy); } svg.rb .t-white { fill: var(--white); } svg.rb .t-bold { font-weight: 600; } svg.rb .t-mono { font-family: var(--font-mono); font-size: var(--fs-mono); } svg.rb .t-code { font-family: var(--font-mono); font-size: var(--fs-mono); fill: var(--code-fg); } svg.rb .t-mains { fill: var(--mains); } svg.rb .t-neutral { fill: var(--neutral); } svg.rb .t-data { fill: var(--data); } svg.rb .t-warn { fill: var(--warn); } svg.rb .t-ok { fill: var(--ok); } svg.rb .t-bad { fill: var(--bad); } svg.rb .t-center { text-anchor: middle; } svg.rb .t-right { text-anchor: end; } svg.rb .t-ink { fill: var(--body); }   svg.rb .box { fill: var(--box); stroke: var(--border); stroke-width: var(--stroke); } svg.rb .box-white { fill: var(--white); stroke: var(--border); stroke-width: var(--stroke); } svg.rb .box-navy { fill: var(--navy); stroke: var(--navy); stroke-width: var(--stroke); } svg.rb .box-code { fill: var(--code); stroke: var(--code); stroke-width: var(--stroke); } svg.rb .box-warn { fill: var(--warn-bg); stroke: var(--warn); stroke-width: var(--stroke); } svg.rb .box-ok { fill: var(--ok-bg); stroke: var(--ok); stroke-width: var(--stroke); } svg.rb .box-bad { fill: var(--bad-bg); stroke: var(--bad); stroke-width: var(--stroke); } svg.rb .box-data { fill: var(--data-bg); stroke: var(--data); stroke-width: var(--stroke); } svg.rb .box-mains { fill: var(--mains-bg); stroke: var(--mains); stroke-width: var(--stroke); } svg.rb .box-mint { fill: var(--mint); stroke: var(--mint); stroke-width: var(--stroke); } svg.rb .box-ghost { fill: none; stroke: var(--ghost); stroke-width: var(--stroke); stroke-dasharray: 8 6; } svg.rb .box-dashed { fill: none; stroke: var(--muted); stroke-width: var(--stroke); stroke-dasharray: 10 7; } svg.rb .box-outline{ fill: none; stroke: var(--navy); stroke-width: var(--stroke); }  svg.rb .ln { fill: none; stroke: var(--navy); stroke-width: var(--wire); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-thin { fill: none; stroke: var(--navy); stroke-width: var(--wire-thin); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-muted { fill: none; stroke: var(--muted); stroke-width: var(--wire-thin); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-mains { fill: none; stroke: var(--mains); stroke-width: var(--wire); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-neutral{ fill: none; stroke: var(--neutral); stroke-width: var(--wire); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-data { fill: none; stroke: var(--data); stroke-width: var(--wire-thin); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-ok { fill: none; stroke: var(--ok); stroke-width: var(--wire); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-bad { fill: none; stroke: var(--bad); stroke-width: var(--wire); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-warn { fill: none; stroke: var(--warn); stroke-width: var(--wire); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-ghost { fill: none; stroke: var(--ghost); stroke-width: var(--wire-thin); stroke-linecap: round; stroke-dasharray: 8 6; } svg.rb .dash { stroke-dasharray: 10 7; } svg.rb .dash-sm { stroke-dasharray: 4 5; }  svg.rb .ah { fill: var(--mint); stroke: var(--navy); stroke-width: 1.5px; stroke-linejoin: round; } svg.rb .ah-navy { fill: var(--navy); stroke: var(--navy); stroke-width: 1.5px; } svg.rb .ah-muted { fill: var(--muted); stroke: var(--muted); } svg.rb .ah-mains { fill: var(--mains); stroke: var(--mains); } svg.rb .ah-neutral{ fill: var(--neutral); stroke: var(--neutral); } svg.rb .ah-data { fill: var(--data); stroke: var(--data); } svg.rb .ah-ok { fill: var(--ok); stroke: var(--ok); } svg.rb .ah-bad { fill: var(--bad); stroke: var(--bad); } svg.rb .ah-warn { fill: var(--warn); stroke: var(--warn); } svg.rb .ah-ghost { fill: var(--ghost); stroke: var(--ghost); }  svg.rb .clamp { fill: var(--white); stroke: var(--navy); stroke-width: var(--wire); } svg.rb .clamp-gap { stroke: var(--white); stroke-width: 6px; } svg.rb .terminal { fill: var(--white); stroke: var(--navy); stroke-width: var(--stroke); } svg.rb .pin { fill: var(--navy); } svg.rb .pin-ghost { fill: var(--ghost); } svg.rb .dot { fill: var(--navy); } svg.rb .dot-mains { fill: var(--mains); } svg.rb .dot-neutral { fill: var(--neutral); } svg.rb .dot-white { fill: var(--white); } svg.rb .dot-mint { fill: var(--mint); } svg.rb .tri { fill: var(--warn-bg); stroke: var(--warn); stroke-width: 3px; stroke-linejoin: round; } svg.rb .tri-mark { fill: var(--warn); } svg.rb .cross { stroke: var(--bad); stroke-width: 5px; stroke-linecap: round; } svg.rb .tick { fill: none; stroke: var(--ok); stroke-width: 5px; stroke-linecap: round; stroke-linejoin: round; } svg.rb .hatch { stroke: var(--ghost); stroke-width: 2px; }</style><title>How rbAmp fits between the mains and your controller</title><text x="40" y="69.92" class="t-title"><tspan x="40" dy="0">How rbAmp fits between the mains and your controller</tspan></text><g class="rb-box"><rect x="40" y="150" width="300" height="250" rx="10" class="box-mains"></rect><text x="58" y="188.18" class="t-h"><tspan x="58" dy="0">Mains circuit</tspan></text><circle cx="64" cy="216.22000000000003" r="3.5" class="dot dot-mains"></circle><text x="78" y="221.68" class="t-small t-ink"><tspan x="78" dy="0">CT clamp (contactless)</tspan><tspan x="78" dy="28">on the L wire</tspan></text><circle cx="64" cy="274.37" r="3.5" class="dot dot-mains"></circle><text x="78" y="279.83000000000004" class="t-small t-ink"><tspan x="78" dy="0">voltage reference tap L</tspan><tspan x="78" dy="28">/ N</tspan></text></g><g class="rb-box"><rect x="400" y="150" width="420" height="250" rx="10" class="box-outline"></rect><text x="418" y="188.18" class="t-h"><tspan x="418" dy="0">rbAmp module</tspan></text><circle cx="424" cy="216.22000000000003" r="3.5" class="dot "></circle><text x="438" y="221.68" class="t-small t-ink"><tspan x="438" dy="0">factory calibration</tspan></text><circle cx="424" cy="246.37000000000003" r="3.5" class="dot "></circle><text x="438" y="251.83" class="t-small t-ink"><tspan x="438" dy="0">U, I, P, PF, f — a new window every</tspan><tspan x="438" dy="28">~100 ms</tspan></text><circle cx="424" cy="304.52" r="3.5" class="dot "></circle><text x="438" y="309.98" class="t-small t-ink"><tspan x="438" dy="0">energy: BASIC on the master · STD</tspan><tspan x="438" dy="28">on the module</tspan></text></g><g><rect x="453.7540576171875" y="382.15" width="312.491884765625" height="35.699999999999996" rx="17.849999999999998" class="box-navy"></rect><text x="610" y="406.3" class="t-small t-white t-bold t-mono" text-anchor="middle"><tspan x="610" dy="0">BASIC | STANDARD (STD)</tspan></text></g><g class="rb-box"><rect x="960" y="150" width="400" height="250" rx="10" class="box-navy"></rect><text x="978" y="188.18" class="t-h t-white "><tspan x="978" dy="0">Your master</tspan></text><circle cx="984" cy="216.22000000000003" r="3.5" class="dot dot-mint"></circle><text x="998" y="221.68" class="t-small t-white"><tspan x="998" dy="0">Arduino · ESP32 (ESP-IDF,</tspan><tspan x="998" dy="28">ESPHome) · Raspberry Pi /</tspan><tspan x="998" dy="28">Python</tspan></text><circle cx="984" cy="302.37" r="3.5" class="dot dot-mint"></circle><text x="998" y="307.83000000000004" class="t-small t-white"><tspan x="998" dy="0">one of four client libraries</tspan></text><circle cx="984" cy="332.52" r="3.5" class="dot dot-mint"></circle><text x="998" y="337.98" class="t-small t-white"><tspan x="998" dy="0">reads values over I²C — no signal</tspan><tspan x="998" dy="28">processing on your side</tspan></text></g><g><path d="M340 275 L400 275" class="ln-mains"></path><path d="M0 0 L-16 -8 L-11.52 0 L-16 8 Z" class="ah-mains" transform="translate(400 275) rotate(0)"></path></g><g><path d="M820 275 L960 275" class="ln"></path><path d="M0 0 L-16 -8 L-11.52 0 L-16 8 Z" class="ah" transform="translate(960 275) rotate(0)"></path><path d="M0 0 L-16 -8 L-11.52 0 L-16 8 Z" class="ah" transform="translate(820 275) rotate(180)"></path></g><g><rect x="861.1313110351563" y="217.15" width="57.7373779296875" height="35.699999999999996" rx="17.849999999999998" class="box-mint"></rect><text x="890" y="241.29999999999998" class="t-small t-navy t-bold" text-anchor="middle"><tspan x="890" dy="0">I²C</tspan></text></g><text x="890" y="309.48" class="t-small t-muted" text-anchor="middle"><tspan x="890" dy="0">SDA · SCL</tspan></text><g class="rb-box"><rect x="960" y="470" width="400" height="116.55000000000003" rx="10" class="box"></rect><text x="976" y="504.72" class="t-body t-bold"><tspan x="976" dy="0">Home Assistant · MQTT · cloud</tspan><tspan x="976" dy="32">· your app</tspan></text><text x="976" y="565.6800000000001" class="t-small"><tspan x="976" dy="0">dashboards, automation, logging</tspan></text></g><g><path d="M1160 400 L1160 470" class="ln"></path><path d="M0 0 L-16 -8 L-11.52 0 L-16 8 Z" class="ah" transform="translate(1160 470) rotate(90)"></path><rect x="923.4743359375001" y="418.35" width="226.5256640625" height="33.3" rx="5" fill="var(--white)" opacity="0.9"></rect><text x="1036.73716796875" y="439.83000000000004" class="t-small t-navy" text-anchor="middle"><tspan x="1036.73716796875" dy="0">Wi-Fi / serial / MQTT</tspan></text></g><text x="40" y="488.48" class="t-small t-muted"><tspan x="40" dy="0">I²C: SDA, SCL + optional DRDY pulse · 50 kHz on</tspan><tspan x="40" dy="28">ESP32/ESP8266 · 100 kHz on UNO, Mega, STM32,</tspan><tspan x="40" dy="28">RP2040, Pi</tspan></text></svg>