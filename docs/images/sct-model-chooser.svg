<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 746" width="1400" height="746" class="rb" role="img"><style>svg.rb {  --navy: #00203F;  --mint: #ADEFD1;  --body: #1a2030;  --muted: #8a9ab0;  --box: #f8f9fa;  --border: #dee2e6;  --code: #1e1e1e;  --code-fg:#e8e8e8; --white: #ffffff;  --mains: #c2410c;  --mains-bg: #fff1e8; --neutral: #1d4ed8;  --lv: #00203F;  --data: #0f766e;  --data-bg: #e6f6f2; --warn: #b45309;  --warn-bg: #fff4d6; --ok: #15803d; --ok-bg: #e3f5e8; --bad: #b91c1c; --bad-bg: #fde8e8; --ghost: #c6ccd4;   --font-sans: Inter, "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif; --font-mono: "JetBrains Mono", "SF Mono", Consolas, Menlo, "DejaVu Sans Mono", monospace; --fs-title: 34px; --fs-sub: 22px; --fs-h: 26px;  --fs-body: 24px;  --fs-small: 21px;  --fs-mono: 22px;  --stroke: 2px;  --wire: 4px;  --wire-thin:2.5px; --radius: 10px; --radius-sm:6px; } svg.rb { font-family: var(--font-sans); font-size: var(--fs-body); fill: var(--body); } svg.rb text { fill: var(--body); font-size: var(--fs-body); white-space: pre; } svg.rb .t-title { font-size: var(--fs-title); font-weight: 600; fill: var(--navy); } svg.rb .t-sub { font-size: var(--fs-sub); fill: var(--muted); } svg.rb .t-h { font-size: var(--fs-h); font-weight: 600; fill: var(--navy); } svg.rb .t-body { font-size: var(--fs-body); fill: var(--body); } svg.rb .t-small { font-size: var(--fs-small); fill: var(--muted); } svg.rb .t-muted { fill: var(--muted); } svg.rb .t-navy { fill: var(--navy); } svg.rb .t-white { fill: var(--white); } svg.rb .t-bold { font-weight: 600; } svg.rb .t-mono { font-family: var(--font-mono); font-size: var(--fs-mono); } svg.rb .t-code { font-family: var(--font-mono); font-size: var(--fs-mono); fill: var(--code-fg); } svg.rb .t-mains { fill: var(--mains); } svg.rb .t-neutral { fill: var(--neutral); } svg.rb .t-data { fill: var(--data); } svg.rb .t-warn { fill: var(--warn); } svg.rb .t-ok { fill: var(--ok); } svg.rb .t-bad { fill: var(--bad); } svg.rb .t-center { text-anchor: middle; } svg.rb .t-right { text-anchor: end; } svg.rb .t-ink { fill: var(--body); }   svg.rb .box { fill: var(--box); stroke: var(--border); stroke-width: var(--stroke); } svg.rb .box-white { fill: var(--white); stroke: var(--border); stroke-width: var(--stroke); } svg.rb .box-navy { fill: var(--navy); stroke: var(--navy); stroke-width: var(--stroke); } svg.rb .box-code { fill: var(--code); stroke: var(--code); stroke-width: var(--stroke); } svg.rb .box-warn { fill: var(--warn-bg); stroke: var(--warn); stroke-width: var(--stroke); } svg.rb .box-ok { fill: var(--ok-bg); stroke: var(--ok); stroke-width: var(--stroke); } svg.rb .box-bad { fill: var(--bad-bg); stroke: var(--bad); stroke-width: var(--stroke); } svg.rb .box-data { fill: var(--data-bg); stroke: var(--data); stroke-width: var(--stroke); } svg.rb .box-mains { fill: var(--mains-bg); stroke: var(--mains); stroke-width: var(--stroke); } svg.rb .box-mint { fill: var(--mint); stroke: var(--mint); stroke-width: var(--stroke); } svg.rb .box-ghost { fill: none; stroke: var(--ghost); stroke-width: var(--stroke); stroke-dasharray: 8 6; } svg.rb .box-dashed { fill: none; stroke: var(--muted); stroke-width: var(--stroke); stroke-dasharray: 10 7; } svg.rb .box-outline{ fill: none; stroke: var(--navy); stroke-width: var(--stroke); }  svg.rb .ln { fill: none; stroke: var(--navy); stroke-width: var(--wire); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-thin { fill: none; stroke: var(--navy); stroke-width: var(--wire-thin); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-muted { fill: none; stroke: var(--muted); stroke-width: var(--wire-thin); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-mains { fill: none; stroke: var(--mains); stroke-width: var(--wire); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-neutral{ fill: none; stroke: var(--neutral); stroke-width: var(--wire); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-data { fill: none; stroke: var(--data); stroke-width: var(--wire-thin); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-ok { fill: none; stroke: var(--ok); stroke-width: var(--wire); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-bad { fill: none; stroke: var(--bad); stroke-width: var(--wire); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-warn { fill: none; stroke: var(--warn); stroke-width: var(--wire); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-ghost { fill: none; stroke: var(--ghost); stroke-width: var(--wire-thin); stroke-linecap: round; stroke-dasharray: 8 6; } svg.rb .dash { stroke-dasharray: 10 7; } svg.rb .dash-sm { stroke-dasharray: 4 5; }  svg.rb .ah { fill: var(--mint); stroke: var(--navy); stroke-width: 1.5px; stroke-linejoin: round; } svg.rb .ah-navy { fill: var(--navy); stroke: var(--navy); stroke-width: 1.5px; } svg.rb .ah-muted { fill: var(--muted); stroke: var(--muted); } svg.rb .ah-mains { fill: var(--mains); stroke: var(--mains); } svg.rb .ah-neutral{ fill: var(--neutral); stroke: var(--neutral); } svg.rb .ah-data { fill: var(--data); stroke: var(--data); } svg.rb .ah-ok { fill: var(--ok); stroke: var(--ok); } svg.rb .ah-bad { fill: var(--bad); stroke: var(--bad); } svg.rb .ah-warn { fill: var(--warn); stroke: var(--warn); } svg.rb .ah-ghost { fill: var(--ghost); stroke: var(--ghost); }  svg.rb .clamp { fill: var(--white); stroke: var(--navy); stroke-width: var(--wire); } svg.rb .clamp-gap { stroke: var(--white); stroke-width: 6px; } svg.rb .terminal { fill: var(--white); stroke: var(--navy); stroke-width: var(--stroke); } svg.rb .pin { fill: var(--navy); } svg.rb .pin-ghost { fill: var(--ghost); } svg.rb .dot { fill: var(--navy); } svg.rb .dot-mains { fill: var(--mains); } svg.rb .dot-neutral { fill: var(--neutral); } svg.rb .dot-white { fill: var(--white); } svg.rb .dot-mint { fill: var(--mint); } svg.rb .tri { fill: var(--warn-bg); stroke: var(--warn); stroke-width: 3px; stroke-linejoin: round; } svg.rb .tri-mark { fill: var(--warn); } svg.rb .cross { stroke: var(--bad); stroke-width: 5px; stroke-linecap: round; } svg.rb .tick { fill: none; stroke: var(--ok); stroke-width: 5px; stroke-linecap: round; stroke-linejoin: round; } svg.rb .hatch { stroke: var(--ghost); stroke-width: 2px; }</style><title>Choosing an SCT-013 clamp and its model code</title><text x="40" y="69.92" class="t-title"><tspan x="40" dy="0">Choosing an SCT-013 clamp and its model code</tspan></text><g class="rb-box"><rect x="40" y="130" width="560" height="76" rx="10" class="box"></rect><text x="320" y="164.72" class="t-body" text-anchor="middle" transform="translate(0 10.6)"><tspan x="320" dy="0">Largest expected current (+30 % margin)</tspan></text></g><g class="rb-box"><rect x="40" y="242" width="560" height="76" rx="10" class="box"></rect><text x="320" y="276.71999999999997" class="t-body" text-anchor="middle" transform="translate(0 10.6)"><tspan x="320" dy="0">Pick the smallest rated clamp above it</tspan></text></g><g><path d="M320 206 L320 242" class="ln"></path><path d="M0 0 L-16 -8 L-11.52 0 L-16 8 Z" class="ah" transform="translate(320 242) rotate(90)"></path></g><g class="rb-box"><rect x="40" y="354" width="560" height="76" rx="10" class="box-white"></rect><text x="320" y="388.72" class="t-body t-mono" text-anchor="middle" transform="translate(0 10.6)"><tspan x="320" dy="0">setCTModel(code)</tspan></text></g><g><path d="M320 318 L320 354" class="ln"></path><path d="M0 0 L-16 -8 L-11.52 0 L-16 8 Z" class="ah" transform="translate(320 354) rotate(90)"></path></g><g class="rb-box"><rect x="640" y="236" width="240" height="120.39999999999999" rx="10" class="box-warn"></rect><text x="760" y="270.71999999999997" class="t-body" text-anchor="middle"><tspan x="760" dy="0">Clip begins at</tspan><tspan x="760" dy="32">about 115–120 %</tspan><tspan x="760" dy="32">of rating</tspan></text></g><g><path d="M640 296.2 L600 280" class="ln-warn"></path><path d="M0 0 L-13 -6.5 L-9.36 0 L-13 6.5 Z" class="ah-warn" transform="translate(600 280) rotate(-157.95205253643965)"></path></g><g class="rb-box"><rect x="40" y="466" width="560" height="56.40000000000005" rx="10" class="box-bad"></rect><text x="320" y="500.72" class="t-body t-bad t-bold" text-anchor="middle"><tspan x="320" dy="0">Too small = clips at peaks, reads low.</tspan></text></g><g class="rb-box"><rect x="40" y="536.4000000000001" width="560" height="56.40000000000005" rx="10" class="box-warn"></rect><text x="320" y="571.1200000000001" class="t-body t-warn t-bold" text-anchor="middle"><tspan x="320" dy="0">Far too large = noisy at low current.</tspan></text></g><g class="rb-box"><rect x="40" y="616.8000000000002" width="560" height="88.40000000000005" rx="10" class="box-white"></rect><text x="320" y="651.5200000000002" class="t-body t-navy t-bold" text-anchor="middle"><tspan x="320" dy="0">Example: 12 A inrush, 2–3 A running → 12 ×</tspan><tspan x="320" dy="32">1.3 = 15.6 A → SCT-013-020</tspan></text></g><rect x="900" y="130" width="420" height="48" class="box-navy" rx="6"></rect><text x="940" y="160.48" class="t-small t-white t-bold" text-anchor="middle"><tspan x="940" dy="0">code</tspan></text><text x="1090" y="160.48" class="t-small t-white t-bold" text-anchor="middle"><tspan x="1090" dy="0">model</tspan></text><text x="1260" y="160.48" class="t-small t-white t-bold" text-anchor="middle"><tspan x="1260" dy="0">rating</tspan></text><rect x="900" y="178" width="420" height="48" class="box-white" rx="0"></rect><text x="940" y="211.12" class="t-body t-navy t-bold t-mono" text-anchor="middle"><tspan x="940" dy="0">1</tspan></text><text x="1090" y="211.12" class="t-body t-body t-mono" text-anchor="middle"><tspan x="1090" dy="0">SCT-013-005</tspan></text><text x="1260" y="211.12" class="t-body t-body" text-anchor="middle"><tspan x="1260" dy="0">5 A</tspan></text><rect x="900" y="226" width="420" height="48" class="box" rx="0"></rect><text x="940" y="259.12" class="t-body t-navy t-bold t-mono" text-anchor="middle"><tspan x="940" dy="0">2</tspan></text><text x="1090" y="259.12" class="t-body t-body t-mono" text-anchor="middle"><tspan x="1090" dy="0">SCT-013-010</tspan></text><text x="1260" y="259.12" class="t-body t-body" text-anchor="middle"><tspan x="1260" dy="0">10 A</tspan></text><rect x="900" y="274" width="420" height="48" class="box-white" rx="0"></rect><text x="940" y="307.12" class="t-body t-navy t-bold t-mono" text-anchor="middle"><tspan x="940" dy="0">3</tspan></text><text x="1090" y="307.12" class="t-body t-body t-mono" text-anchor="middle"><tspan x="1090" dy="0">SCT-013-030</tspan></text><text x="1260" y="307.12" class="t-body t-body" text-anchor="middle"><tspan x="1260" dy="0">30 A</tspan></text><rect x="900" y="322" width="420" height="48" class="box" rx="0"></rect><text x="940" y="355.12" class="t-body t-navy t-bold t-mono" text-anchor="middle"><tspan x="940" dy="0">4</tspan></text><text x="1090" y="355.12" class="t-body t-body t-mono" text-anchor="middle"><tspan x="1090" dy="0">SCT-013-050</tspan></text><text x="1260" y="355.12" class="t-body t-body" text-anchor="middle"><tspan x="1260" dy="0">50 A</tspan></text><rect x="900" y="370" width="420" height="48" class="box-white" rx="0"></rect><text x="940" y="403.12" class="t-body t-navy t-bold t-mono" text-anchor="middle"><tspan x="940" dy="0">5</tspan></text><text x="1090" y="403.12" class="t-body t-body t-mono" text-anchor="middle"><tspan x="1090" dy="0">SCT-013-100</tspan></text><text x="1260" y="403.12" class="t-body t-body" text-anchor="middle"><tspan x="1260" dy="0">100 A</tspan></text><rect x="900" y="418" width="420" height="48" class="box" rx="0"></rect><text x="940" y="451.12" class="t-body t-navy t-bold t-mono" text-anchor="middle"><tspan x="940" dy="0">6</tspan></text><text x="1090" y="451.12" class="t-body t-body t-mono" text-anchor="middle"><tspan x="1090" dy="0">SCT-013-020</tspan></text><text x="1260" y="451.12" class="t-body t-body" text-anchor="middle"><tspan x="1260" dy="0">20 A</tspan></text><rect x="900" y="466" width="420" height="48" class="box-white" rx="0"></rect><text x="940" y="499.12" class="t-body t-navy t-bold t-mono" text-anchor="middle"><tspan x="940" dy="0">7</tspan></text><text x="1090" y="499.12" class="t-body t-body t-mono" text-anchor="middle"><tspan x="1090" dy="0">SCT-013-060</tspan></text><text x="1260" y="499.12" class="t-body t-body" text-anchor="middle"><tspan x="1260" dy="0">60 A</tspan></text><text x="900" y="546.48" class="t-small t-warn t-bold"><tspan x="900" dy="0">codes are NOT ordered by rating</tspan></text><g><path d="M600 392 L880 392 L880 322 L900 322" class="ln-thin"></path><path d="M0 0 L-13 -6.5 L-9.36 0 L-13 6.5 Z" class="ah" transform="translate(900 322) rotate(0)"></path></g></svg>