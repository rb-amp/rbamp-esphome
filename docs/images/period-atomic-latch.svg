<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 829" width="1400" height="829" class="rb" role="img"><style>svg.rb {  --navy: #00203F;  --mint: #ADEFD1;  --body: #1a2030;  --muted: #8a9ab0;  --box: #f8f9fa;  --border: #dee2e6;  --code: #1e1e1e;  --code-fg:#e8e8e8; --white: #ffffff;  --mains: #c2410c;  --mains-bg: #fff1e8; --neutral: #1d4ed8;  --lv: #00203F;  --data: #0f766e;  --data-bg: #e6f6f2; --warn: #b45309;  --warn-bg: #fff4d6; --ok: #15803d; --ok-bg: #e3f5e8; --bad: #b91c1c; --bad-bg: #fde8e8; --ghost: #c6ccd4;   --font-sans: Inter, "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif; --font-mono: "JetBrains Mono", "SF Mono", Consolas, Menlo, "DejaVu Sans Mono", monospace; --fs-title: 34px; --fs-sub: 22px; --fs-h: 26px;  --fs-body: 24px;  --fs-small: 21px;  --fs-mono: 22px;  --stroke: 2px;  --wire: 4px;  --wire-thin:2.5px; --radius: 10px; --radius-sm:6px; } svg.rb { font-family: var(--font-sans); font-size: var(--fs-body); fill: var(--body); } svg.rb text { fill: var(--body); font-size: var(--fs-body); white-space: pre; } svg.rb .t-title { font-size: var(--fs-title); font-weight: 600; fill: var(--navy); } svg.rb .t-sub { font-size: var(--fs-sub); fill: var(--muted); } svg.rb .t-h { font-size: var(--fs-h); font-weight: 600; fill: var(--navy); } svg.rb .t-body { font-size: var(--fs-body); fill: var(--body); } svg.rb .t-small { font-size: var(--fs-small); fill: var(--muted); } svg.rb .t-muted { fill: var(--muted); } svg.rb .t-navy { fill: var(--navy); } svg.rb .t-white { fill: var(--white); } svg.rb .t-bold { font-weight: 600; } svg.rb .t-mono { font-family: var(--font-mono); font-size: var(--fs-mono); } svg.rb .t-code { font-family: var(--font-mono); font-size: var(--fs-mono); fill: var(--code-fg); } svg.rb .t-mains { fill: var(--mains); } svg.rb .t-neutral { fill: var(--neutral); } svg.rb .t-data { fill: var(--data); } svg.rb .t-warn { fill: var(--warn); } svg.rb .t-ok { fill: var(--ok); } svg.rb .t-bad { fill: var(--bad); } svg.rb .t-center { text-anchor: middle; } svg.rb .t-right { text-anchor: end; } svg.rb .t-ink { fill: var(--body); }   svg.rb .box { fill: var(--box); stroke: var(--border); stroke-width: var(--stroke); } svg.rb .box-white { fill: var(--white); stroke: var(--border); stroke-width: var(--stroke); } svg.rb .box-navy { fill: var(--navy); stroke: var(--navy); stroke-width: var(--stroke); } svg.rb .box-code { fill: var(--code); stroke: var(--code); stroke-width: var(--stroke); } svg.rb .box-warn { fill: var(--warn-bg); stroke: var(--warn); stroke-width: var(--stroke); } svg.rb .box-ok { fill: var(--ok-bg); stroke: var(--ok); stroke-width: var(--stroke); } svg.rb .box-bad { fill: var(--bad-bg); stroke: var(--bad); stroke-width: var(--stroke); } svg.rb .box-data { fill: var(--data-bg); stroke: var(--data); stroke-width: var(--stroke); } svg.rb .box-mains { fill: var(--mains-bg); stroke: var(--mains); stroke-width: var(--stroke); } svg.rb .box-mint { fill: var(--mint); stroke: var(--mint); stroke-width: var(--stroke); } svg.rb .box-ghost { fill: none; stroke: var(--ghost); stroke-width: var(--stroke); stroke-dasharray: 8 6; } svg.rb .box-dashed { fill: none; stroke: var(--muted); stroke-width: var(--stroke); stroke-dasharray: 10 7; } svg.rb .box-outline{ fill: none; stroke: var(--navy); stroke-width: var(--stroke); }  svg.rb .ln { fill: none; stroke: var(--navy); stroke-width: var(--wire); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-thin { fill: none; stroke: var(--navy); stroke-width: var(--wire-thin); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-muted { fill: none; stroke: var(--muted); stroke-width: var(--wire-thin); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-mains { fill: none; stroke: var(--mains); stroke-width: var(--wire); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-neutral{ fill: none; stroke: var(--neutral); stroke-width: var(--wire); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-data { fill: none; stroke: var(--data); stroke-width: var(--wire-thin); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-ok { fill: none; stroke: var(--ok); stroke-width: var(--wire); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-bad { fill: none; stroke: var(--bad); stroke-width: var(--wire); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-warn { fill: none; stroke: var(--warn); stroke-width: var(--wire); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-ghost { fill: none; stroke: var(--ghost); stroke-width: var(--wire-thin); stroke-linecap: round; stroke-dasharray: 8 6; } svg.rb .dash { stroke-dasharray: 10 7; } svg.rb .dash-sm { stroke-dasharray: 4 5; }  svg.rb .ah { fill: var(--mint); stroke: var(--navy); stroke-width: 1.5px; stroke-linejoin: round; } svg.rb .ah-navy { fill: var(--navy); stroke: var(--navy); stroke-width: 1.5px; } svg.rb .ah-muted { fill: var(--muted); stroke: var(--muted); } svg.rb .ah-mains { fill: var(--mains); stroke: var(--mains); } svg.rb .ah-neutral{ fill: var(--neutral); stroke: var(--neutral); } svg.rb .ah-data { fill: var(--data); stroke: var(--data); } svg.rb .ah-ok { fill: var(--ok); stroke: var(--ok); } svg.rb .ah-bad { fill: var(--bad); stroke: var(--bad); } svg.rb .ah-warn { fill: var(--warn); stroke: var(--warn); } svg.rb .ah-ghost { fill: var(--ghost); stroke: var(--ghost); }  svg.rb .clamp { fill: var(--white); stroke: var(--navy); stroke-width: var(--wire); } svg.rb .clamp-gap { stroke: var(--white); stroke-width: 6px; } svg.rb .terminal { fill: var(--white); stroke: var(--navy); stroke-width: var(--stroke); } svg.rb .pin { fill: var(--navy); } svg.rb .pin-ghost { fill: var(--ghost); } svg.rb .dot { fill: var(--navy); } svg.rb .dot-mains { fill: var(--mains); } svg.rb .dot-neutral { fill: var(--neutral); } svg.rb .dot-white { fill: var(--white); } svg.rb .dot-mint { fill: var(--mint); } svg.rb .tri { fill: var(--warn-bg); stroke: var(--warn); stroke-width: 3px; stroke-linejoin: round; } svg.rb .tri-mark { fill: var(--warn); } svg.rb .cross { stroke: var(--bad); stroke-width: 5px; stroke-linecap: round; } svg.rb .tick { fill: none; stroke: var(--ok); stroke-width: 5px; stroke-linecap: round; stroke-linejoin: round; } svg.rb .hatch { stroke: var(--ghost); stroke-width: 2px; }</style><title>Period latch: one write closes period N and opens N+1</title><text x="40" y="69.92" class="t-title"><tspan x="40" dy="0">Period latch: one write closes period N and opens N+1</tspan></text><text x="40" y="216.88" class="t-h"><tspan x="40" dy="0">Module: period</tspan><tspan x="40" dy="34">accumulator</tspan></text><text x="40" y="284.38" class="t-small"><tspan x="40" dy="0">averages the windows</tspan><tspan x="40" dy="28">of the running period</tspan></text><rect x="320" y="200" width="440" height="60" class="box" rx="0"></rect><text x="540" y="239.12" class="t-body t-navy t-bold" text-anchor="middle"><tspan x="540" dy="0">period N — accumulating</tspan></text><rect x="760" y="200" width="480" height="60" class="box-white" rx="0"></rect><text x="1000" y="239.12" class="t-body t-navy t-bold" text-anchor="middle"><tspan x="1000" dy="0">period N+1 — accumulating</tspan></text><rect x="1240" y="200" width="100" height="60" class="box-ghost" rx="0"></rect><text x="1290" y="236.48" class="t-small t-muted" text-anchor="middle"><tspan x="1290" dy="0">N+2</tspan></text><g><path d="M760 150 L760 430" class="ln"></path></g><g><rect x="714.4441040039062" y="118.15" width="91.1117919921875" height="35.699999999999996" rx="17.849999999999998" class="box-mint"></rect><text x="760" y="142.29999999999998" class="t-small t-navy t-bold t-mono" text-anchor="middle"><tspan x="760" dy="0">LATCH</tspan></text></g><g><path d="M1240 150 L1240 430" class="ln-ghost"></path></g><g><rect x="1194.4441040039062" y="118.15" width="91.1117919921875" height="35.699999999999996" rx="17.849999999999998" class="box-ghost"></rect><text x="1240" y="142.29999999999998" class="t-small t-navy t-bold t-mono" text-anchor="middle"><tspan x="1240" dy="0">LATCH</tspan></text></g><text x="774" y="174.48" class="t-small t-navy t-bold t-mono"><tspan x="774" dy="0">CMD_LATCH_PERIOD</tspan></text><text x="774" y="288.48" class="t-small t-navy"><tspan x="774" dy="0">no gap: one write closes N, opens N+1</tspan></text><text x="40" y="386.88" class="t-h"><tspan x="40" dy="0">Module: period</tspan><tspan x="40" dy="34">snapshot</tspan></text><text x="40" y="454.38" class="t-small"><tspan x="40" dy="0">frozen copy of the last</tspan><tspan x="40" dy="28">closed period</tspan></text><rect x="320" y="370" width="440" height="60" class="box-ghost" rx="0"></rect><text x="540" y="406.48" class="t-small t-muted" text-anchor="middle"><tspan x="540" dy="0">snapshot N−1</tspan></text><rect x="760" y="370" width="480" height="60" class="box-data" rx="0"></rect><text x="1000" y="404.72" class="t-small t-data t-bold" text-anchor="middle" style="font-size:19px"><tspan x="1000" dy="0">snapshot N — frozen: avg P, max P, period length</tspan></text><g><path d="M750 260 L750 370" class="ln-data"></path><path d="M0 0 L-13 -6.5 L-9.36 0 L-13 6.5 Z" class="ah-data" transform="translate(750 370) rotate(90)"></path></g><text x="40" y="560.88" class="t-h"><tspan x="40" dy="0">Master</tspan></text><g><path d="M940 550 L940 430" class="ln-data"></path><path d="M0 0 L-13 -6.5 L-9.36 0 L-13 6.5 Z" class="ah-data" transform="translate(940 430) rotate(-90)"></path></g><rect x="320" y="540" width="600" height="4" fill="var(--border)"></rect><text x="954" y="568.48" class="t-small t-data t-bold"><tspan x="954" dy="0">read snapshot N — any time before the</tspan><tspan x="954" dy="28">next latch</tspan></text><g class="rb-box"><rect x="40" y="630" width="1320" height="56.40000000000005" rx="10" class="box-warn"></rect><text x="700" y="664.72" class="t-body t-bold" text-anchor="middle"><tspan x="700" dy="0">First latch after begin() = primer: snapshot discarded</tspan></text></g><g class="rb-box"><rect x="40" y="700.4000000000001" width="650" height="88.40000000000005" rx="10" class="box-white"></rect><text x="365" y="735.1200000000001" class="t-body" text-anchor="middle"><tspan x="365" dy="0">BASIC: master multiplies avg P × its own dt → Wh</tspan><tspan x="365" dy="32">(master clock)</tspan></text></g><g class="rb-box"><rect x="710" y="700.4000000000001" width="650" height="88.40000000000005" rx="10" class="box-white"></rect><text x="1035" y="735.1200000000001" class="t-body" text-anchor="middle"><tspan x="1035" dy="0">STD: on-device cumulative counters, read as a</tspan><tspan x="1035" dy="32">difference between snapshots</tspan></text></g></svg>